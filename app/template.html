<title>SF Morning Runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>/*LEAFLET_CSS*/</style>
<style>
/* Layout: control rail on the left, topo map filling the right with the elevation profile docked under it; stacks on phones. */
:root {
  --bg: #e9ece7; --panel: #f6f7f3; --ink: #18201d; --muted: #5b6862; --line: #d2d8d1;
  --accent: #1e6b5c; --accent-ink: #ffffff; --accent-soft: #d6e7e1;
  --land-lo: #eef0ea; --land-hi: #d9d2c0; --water: #c9dbe2; --contour: rgba(90,80,60,.28); --street: rgba(24,32,29,.55); --street-major: rgba(24,32,29,.8); --trail: #3f7d4a;
  --g0: #2e9e6f; --g1: #d9b62b; --g2: #e7802c; --g3: #d33d36; --g4: #8e2b7d;
  --casing: #ffffff; --shadow: 0 1px 2px rgba(20,30,25,.08), 0 6px 20px rgba(20,30,25,.08);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --panel: #171e1b; --ink: #e5ebe7; --muted: #95a39d; --line: #2a3430;
  --accent: #5cc0a6; --accent-ink: #0b1411; --accent-soft: #1d3730;
  --land-lo: #1a201d; --land-hi: #3a382f; --water: #10222a; --contour: rgba(220,210,180,.16); --street: rgba(229,235,231,.42); --street-major: rgba(229,235,231,.7); --trail: #7cc68a;
  --casing: #0d1210; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111614; --panel: #171e1b; --ink: #e5ebe7; --muted: #95a39d; --line: #2a3430;
  --accent: #5cc0a6; --accent-ink: #0b1411; --accent-soft: #1d3730;
  --land-lo: #1a201d; --land-hi: #3a382f; --water: #10222a; --contour: rgba(220,210,180,.16); --street: rgba(229,235,231,.42); --street-major: rgba(229,235,231,.7); --trail: #7cc68a;
  --casing: #0d1210; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); height: 100%; }
.rail-top { display: flex; flex-direction: column; gap: 18px; }
.rail { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
#map { min-height: 0; background: var(--bg); }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .app { display: flex; flex-direction: column; }
  .rail { display: contents; }
  .rail-top { order: 1; background: var(--panel); padding: 16px 16px 20px; }
  .stage { order: 2; grid-template-rows: 60vh auto; }
  .detail { order: 3; background: var(--panel); padding: 20px 16px 32px; border-top: 1px solid var(--line); }
  .detail:empty { display: none; }
}

.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font: 800 26px/1.05 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.brand .home { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.label { font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.ask { display: flex; flex-direction: column; gap: 8px; }
.ask textarea { width: 100%; min-height: 64px; resize: vertical; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font: 500 16px/1.35 var(--f-body); color: var(--ink); }
.ask textarea:focus { outline: none; border-color: var(--accent); }
.ask-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .55; cursor: progress; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--ink); border-color: var(--muted); }
.chip.on { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.understood { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.understood b { color: var(--ink); font-weight: 600; }

.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field input[type=text] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.field input:focus { outline: none; border-color: var(--accent); }
.inline { display: flex; gap: 6px; align-items: center; }
.inline input { flex: 1; }
.pickbtn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: 12px; color: var(--muted); white-space: nowrap; }
.pickbtn.on { border-color: var(--accent); color: var(--accent); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; padding: 7px 4px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ink); color: var(--panel); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.hint { font-size: 12px; color: var(--muted); }
.dests { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dests .chip.on::after { content: " ×"; }

.update-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.status { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; min-height: 20px; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

.cards { display: flex; flex-direction: column; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; background: var(--bg); display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; width: 100%; }
.card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--panel); }
.card .tag { grid-row: span 3; font: 800 22px/1 var(--f-display); color: var(--muted); padding-top: 2px; }
.card.on .tag { color: var(--accent); }
.card .name { font: 700 16px/1.2 var(--f-display); min-width: 0; }
.card .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 13px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.card .stats b { color: var(--ink); font-weight: 500; }
.card svg { width: 100%; height: 30px; display: block; }

.detail { display: flex; flex-direction: column; gap: 14px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.kpi { border-top: 2px solid var(--ink); padding-top: 6px; }
.kpi .v { font: 700 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .v small { font: 500 12px var(--f-mono); color: var(--muted); margin-left: 2px; }
.kpi .k { font-size: 12px; color: var(--muted); }
.gradebar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.list { display: flex; flex-direction: column; }
.list .row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.list .row span:last-child { font: 13px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details[open] summary { margin-bottom: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions a.btn { text-decoration: none; display: inline-block; }
.toast { font-size: 13px; color: var(--accent); min-height: 1.2em; }

.profile { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px 12px; position: relative; }
.profile-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.profile-head .readout { font: 13px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
#profile { width: 100%; height: 150px; display: block; touch-action: none; }
#profile text { fill: var(--muted); font: 11px var(--f-mono); }
#profile .grid { stroke: var(--line); stroke-width: 1; }
#profile .cursor { stroke: var(--ink); stroke-width: 1; }

/* map chrome */
.leaflet-container { background: var(--bg); font-family: var(--f-body); }
.leaflet-control-zoom a { background: var(--panel) !important; color: var(--ink) !important; border-color: var(--line) !important; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--muted) !important; font-size: 10px; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.peak-label { font: 600 11px/1.1 var(--f-body); color: var(--ink); white-space: nowrap; text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 3px var(--bg); pointer-events: none; }
.peak-label small { font: 10px var(--f-mono); color: var(--muted); display: block; }
.pin { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--casing); box-shadow: 0 0 0 1.5px var(--ink); }
.pin.start { background: var(--accent); }
.pin.end { background: var(--ink); }
.pin.hover { width: 12px; height: 12px; background: var(--ink); border-width: 2px; }
.map-loading[hidden] { display: none; }
.map-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; z-index: 500; pointer-events: none; }
.stage { position: relative; }
.empty { color: var(--muted); font-size: 14px; }
</style>

<div class="app">
  <aside class="rail">
   <div class="rail-top">
    <div class="brand">
      <h1>SF Morning Runs</h1>
      <span class="home" id="homeLabel">⌂ 339 Elsie St</span>
    </div>

    <section class="ask">
      <label class="label" for="prompt">Describe the run</label>
      <textarea id="prompt" rows="2">go to a cool hilltop with a 7 mile long route</textarea>
      <div class="ask-row">
        <button class="btn" id="planBtn">Plan routes</button>
        <button class="btn ghost" id="shuffleBtn" title="Same settings, new variations">Shuffle</button>
        <span class="hint" id="aiHint"></span>
      </div>
      <div class="examples" id="examples"></div>
      <div class="understood" id="understood"></div>
    </section>

    <section class="form" aria-label="Run settings">
      <div class="field wide">
        <label class="label" for="startIn">Start</label>
        <div class="inline"><input type="text" id="startIn" value="339 Elsie St" autocomplete="off"><button class="pickbtn" id="pickStart">Pick on map</button></div>
      </div>
      <div class="field wide">
        <label class="label" for="endIn">Finish</label>
        <div class="inline"><input type="text" id="endIn" placeholder="Same as start" autocomplete="off"><button class="pickbtn" id="pickEnd">Pick on map</button></div>
      </div>
      <div class="field">
        <span class="label">Plan by</span>
        <div class="seg" id="modeSeg"><button data-v="distance" class="on">Distance</button><button data-v="time">Time</button></div>
      </div>
      <div class="field">
        <label class="label" for="amountIn" id="amountLabel">Miles</label>
        <input type="text" id="amountIn" class="num" value="7" inputmode="decimal" placeholder="Any">
      </div>
      <div class="field">
        <label class="label" for="paceIn">Pace (min/mi)</label>
        <input type="text" id="paceIn" class="num" value="8:30" inputmode="numeric">
      </div>
      <div class="field">
        <span class="label">Shape</span>
        <div class="seg" id="shapeSeg"><button data-v="loop" class="on">Loop</button><button data-v="out-and-back">Out &amp; back</button></div>
      </div>
      <div class="field wide">
        <span class="label">Terrain</span>
        <div class="seg" id="hillSeg"><button data-v="flat">Flat</button><button data-v="rolling" class="on">Rolling</button><button data-v="hilly">Hilly</button><button data-v="max">Max climb</button></div>
      </div>
      <div class="field wide">
        <div class="toggles">
          <button class="chip" id="tFast" aria-pressed="false">Fast / tempo</button>
          <button class="chip" id="tTrails" aria-pressed="false">Prefer trails &amp; parks</button>
          <button class="chip" id="tSteps" aria-pressed="false">Avoid stairs</button>
          <button class="chip" id="tHill" aria-pressed="false">Include a hilltop</button>
        </div>
      </div>
      <div class="field wide">
        <span class="label">Go through</span>
        <div class="dests" id="dests"></div>
        <details>
          <summary class="hint">Add a hill or spot</summary>
          <div class="dests" id="placePicker"></div>
        </details>
      </div>
    </section>

    <div class="update-row"><button class="btn" id="updateBtn">Update routes</button><span class="hint">Setting changes replan automatically. Typed fields replan on Enter.</span></div>
    <div class="status" id="status"></div>
    <section class="cards" id="cards" aria-label="Route options"></section>
   </div>
    <section class="detail" id="detail"></section>
  </aside>

  <main class="stage">
    <div id="map"></div>
    <div class="map-loading" id="mapLoading">Loading San Francisco streets and terrain…</div>
    <div class="profile">
      <div class="profile-head"><span class="label">Elevation profile</span><span class="readout" id="readout">Hover the profile to scrub the route</span></div>
      <svg id="profile" viewBox="0 0 800 150" preserveAspectRatio="none" aria-label="Elevation profile"></svg>
    </div>
  </main>
</div>

<script>
(() => {
const TERRAIN_BOUNDS = %%TERRAIN_BOUNDS%%;
const HOME = { lat: 37.7387, lon: -122.41984, label: '339 Elsie St' };
const MI = 1609.344, FT = 3.28084;
const $ = (id) => document.getElementById(id);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const lib = RouterLib();
let G = null, worker = null, map = null, routeLayer = null, markers = {}, hoverMarker = null;
let results = [], sel = 0, reqId = 0, picking = null, seed = 0;

// ---------- state ----------
const S = {
  startText: '339 Elsie St', endText: '', mode: 'distance', amount: 7, pace: '8:30', shape: 'loop',
  hill: 'rolling', fast: false, trails: false, avoidSteps: false, hillTop: false, dests: [],
  start: HOME, end: null,
};
try { const p = JSON.parse(localStorage.getItem('sfruns.prefs') || 'null'); if (p && p.pace) S.pace = p.pace; } catch (e) {}
const savePrefs = () => { try { localStorage.setItem('sfruns.prefs', JSON.stringify({ pace: S.pace })); } catch (e) {} };

const EXAMPLES = [
  'go to a cool hilltop with a 7 mile long route',
  'long and fast route',
  'easy flat 30 minutes',
  'hilly 10k through Bernal and Holly Park',
  'Twin Peaks and back, max climbing',
  '6 miles ending at the Ferry Building',
  '45 min tempo at 7:15 pace, trails if possible',
];

// ---------- natural language ----------
let PL = null; // ParseLib, created once places are loaded
const paceToSec = (p) => { const m = String(p ?? '').trim().match(/^(\d{1,2})(?::(\d{1,2}))?$/); return m ? (+m[1]) * 60 + (+(m[2] || 0)) : null; };
function secToPace(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtDur(s) { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`; }

// ---------- natural language: Claude ----------
let samplePromise = null;
function getSample() { if (!samplePromise) samplePromise = (window.claude?.use ? window.claude.use('sample') : Promise.resolve(null)).catch(() => null); return samplePromise; }
async function claudeParse(text) {
  const sample = await getSample(); if (!sample) return null;
  const places = G.places.map(p => `${p.name} (${p.kind}, ${Math.round(p.el * FT)} ft)`).join('; ');
  const prompt = `You convert a runner's request into settings for a San Francisco running-route planner.
Home (default start and finish) is 339 Elsie St in Bernal Heights.
Known hills and spots (use these exact names for destinations): ${places}.

Request: """${text}"""

Reply with only JSON, no prose:
{"distance_miles": number|null, "duration_minutes": number|null, "pace": "m:ss"|null,
 "terrain": "flat"|"rolling"|"hilly"|"max"|null, "fast": boolean, "trails": boolean, "avoid_stairs": boolean,
 "shape": "loop"|"out-and-back"|null, "destinations": [exact names from the list, in visiting order],
 "hilltop": boolean, "start": string|null, "end": string|null, "summary": string}
Rules: only list destinations the runner explicitly named; never add stops on your own (a "flat" or "easy" run has no destinations unless named).
Copy numbers exactly as stated; do not compute a distance from a time. "12 min pace" is a pace, not a duration.
"long" with no number means 9 miles, "short" means 3. "fast"/"tempo" means fast=true and flatter terrain unless hills are asked for.
"cool hilltop"/"a view" with no named place means hilltop=true and no destinations. start/end are only set when the runner names a different place or address (an address, intersection, or a name from the list); null means home.
Convert km to miles. summary is a short phrase restating the plan (max 12 words).`;
  try {
    const out = await sample.json(prompt, { modelTier: 'quick' });
    return out && typeof out === 'object' ? out : null;
  } catch (e) { if (e && e.code === 'not_granted') samplePromise = Promise.resolve(null); return null; }
}

function applyParse(r) {
  const v = PL.resolve(r, S.pace);
  S.pace = v.pace; S.mode = v.mode; S.amount = v.amount == null ? null : Math.round(v.amount * 100) / 100;
  S.hill = r.hill || (r.hillTop || r.dests.length ? 'hilly' : 'rolling');
  if (r.hillTop && S.hill === 'flat') S.hill = 'rolling';
  S.fast = r.fast; S.trails = r.trails; S.avoidSteps = r.avoidSteps; S.shape = r.shape || 'loop';
  S.dests = r.dests.slice(0, 5); S.hillTop = r.hillTop && !S.dests.length;
  S.startText = r.start || '339 Elsie St'; S.endText = r.end || '';
  syncForm();
  return r;
}
function targetMiles() {
  if (S.amount == null || !(S.amount > 0)) return null;
  return S.mode === 'distance' ? S.amount : S.amount * 60 / (paceToSec(S.pace) || 510);
}

function describeSettings(r) {
  const bits = [];
  const tm = targetMiles();
  bits.push(tm == null ? '<b>any distance</b>' : S.mode === 'distance' ? `<b>${S.amount} mi</b>` : `<b>${S.amount} min</b> at ${S.pace}/mi = <b>${tm.toFixed(2)} mi</b>`);
  bits.push(`<b>${{ flat: 'flat', rolling: 'rolling', hilly: 'hilly', max: 'max climbing' }[S.hill]}</b>`);
  if (S.fast) bits.push('fast');
  if (S.trails) bits.push('trails');
  if (S.hillTop) bits.push('to a hilltop');
  if (S.dests.length) bits.push('via ' + S.dests.join(', '));
  bits.push(S.shape === 'out-and-back' ? 'out & back' : (S.endText ? 'finish at ' + esc(S.endText) : 'loop'));
  if (S.startText && S.startText !== '339 Elsie St') bits.push('from ' + esc(S.startText));
  return 'Planning ' + bits.join(' · ');
}
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- form sync ----------
function syncForm() {
  $('startIn').value = S.startText; $('endIn').value = S.endText;
  $('amountIn').value = S.amount == null ? '' : S.amount; $('paceIn').value = S.pace;
  $('amountLabel').textContent = S.mode === 'distance' ? 'Miles' : 'Minutes';
  for (const [id, v] of [['modeSeg', S.mode], ['shapeSeg', S.shape], ['hillSeg', S.hill]])
    for (const b of $(id).querySelectorAll('button')) b.classList.toggle('on', b.dataset.v === v);
  for (const [id, v] of [['tFast', S.fast], ['tTrails', S.trails], ['tSteps', S.avoidSteps], ['tHill', S.hillTop]]) { $(id).classList.toggle('on', v); $(id).setAttribute('aria-pressed', v); }
  const d = $('dests'); d.innerHTML = '';

  for (let i = 0; i < n; i++) { MX[i] = (G.vLon[i] + 180) / 360; const s = Math.sin(G.vLat[i] * Math.PI / 180); MY[i] = 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); }
  BK = new Map(); const Z = 15;
  for (let e = 0; e < G.nE; e++) {
    const o = G.vOff[e], k = G.eN[e]; const keys = new Set();
    for (let j = 0; j < k; j++) keys.add(Math.floor(MX[o + j] * (1 << Z)) * 100000 + Math.floor(MY[o + j] * (1 << Z)));
    for (const key of keys) { let a = BK.get(key); if (!a) BK.set(key, a = []); a.push(e); }
  }
}
const StreetLayer = L.GridLayer.extend({
  createTile(c) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 512; cv.style.width = cv.style.height = '256px';
    const cx = cv.getContext('2d'); cx.scale(2, 2);
    const z = c.z, Z = 15, scale = 256 * Math.pow(2, z);
    const ox = c.x * 256, oy = c.y * 256;
    // collect edges from buckets covering this tile (with a margin)
    const f = Math.pow(2, Z - z);
    const x0 = Math.floor((c.x - .05) * f), x1 = Math.floor((c.x + 1.05) * f), y0 = Math.floor((c.y - .05) * f), y1 = Math.floor((c.y + 1.05) * f);
    const es = new Set();
    for (let bx = x0; bx <= x1; bx++) for (let by = y0; by <= y1; by++) { const a = BK.get(bx * 100000 + by); if (a) for (const e of a) es.add(e); }
    const cls = G.classes, groups = { minor: [], walk: [], steps: [], major: [], side: [] };
    for (const e of es) {
      const k = cls[G.eCls[e]];
      if (k === 'sidewalk' || k === 'crosswalk') { if (z >= 16) groups.side.push(e); }
      else if (k === 'path' || k === 'footway' || k === 'track' || k === 'bridleway' || k === 'pedestrian' || k === 'cycleway') { if (z >= 13) groups.walk.push(e); }
      else if (k === 'steps') { if (z >= 14) groups.steps.push(e); }
      else if (k === 'primary' || k === 'secondary' || k === 'trunk') groups.major.push(e);
      else groups.minor.push(e);
    }
    const w = (base) => base * Math.max(0.35, Math.pow(1.45, z - 15));
    const stroke = (list, color, width, dash) => {
      if (!list.length) return; cx.beginPath();
      for (const e of list) { const o = G.vOff[e], n = G.eN[e]; cx.moveTo(MX[o] * scale - ox, MY[o] * scale - oy); for (let j = 1; j < n; j++) cx.lineTo(MX[o + j] * scale - ox, MY[o + j] * scale - oy); }
      cx.strokeStyle = color; cx.lineWidth = width; cx.setLineDash(dash || []); cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.stroke();
    };
    stroke(groups.side, css('--street'), w(0.5));
    stroke(groups.minor, css('--street'), w(1.3));
    stroke(groups.walk, css('--trail'), w(1.3), z >= 15 ? [w(3), w(2.5)] : null);
    stroke(groups.steps, css('--trail'), w(2.6), [w(1), w(1.5)]);
    stroke(groups.major, css('--street-major'), w(2.2));
    return cv;
  }
});
function drawPeaks() {
  peakLayer.clearLayers(); const z = map.getZoom();
  for (const p of G.places) {
    if (p.kind !== 'hill' && z < 15) continue;
    if (p.kind === 'hill' && z < 13 && p.el < 120) continue;
    const html = p.kind === 'hill' ? `<div class="peak-label">▲ ${esc(p.name)}<small>${Math.round(p.el * FT)} ft</small></div>` : `<div class="peak-label" style="font-weight:500;color:var(--muted)">${esc(p.name)}</div>`;
    L.marker([p.lat, p.lon], { icon: L.divIcon({ className: '', html, iconSize: null, iconAnchor: [5, 8] }), interactive: false, keyboard: false }).addTo(peakLayer);
  }
}
function drawRoute() {
  if (!map) return;
  if (routeLayer) routeLayer.remove();
  routeLayer = L.layerGroup().addTo(map);
  if (hoverMarker) { hoverMarker.remove(); hoverMarker = null; }
  // faint alternates
  results.forEach((r, i) => { if (i !== sel) L.polyline(r.geom.lat.map((la, k) => [la, r.geom.lon[k]]), { color: css('--ink'), weight: 3, opacity: 0.25, dashArray: '2 6', interactive: true }).on('click', () => { sel = i; renderAll(); }).addTo(routeLayer); });
  const r = results[sel]; if (!r) return;
  const g = r.geom, ll = g.lat.map((la, k) => [la, g.lon[k]]);
  L.polyline(ll, { color: css('--casing'), weight: 9, opacity: 0.95, interactive: false }).addTo(routeLayer);
  // colour by grade, merging runs of the same colour
  let cur = null, seg = [];
  const flush = () => { if (seg.length > 1) L.polyline(seg, { color: cur, weight: 5, opacity: 1, interactive: false, lineCap: 'round' }).addTo(routeLayer); };
  for (let k = 0; k < ll.length; k++) {
    const gi = Math.min(r.grades.length - 1, Math.round(g.cum[k] / r.gradeStep));
    const c = gradeColor(r.colorGrades[gi]);
    if (c !== cur) { if (seg.length) { flush(); seg = [seg[seg.length - 1]]; } cur = c; }
    seg.push(ll[k]);
  }
  flush();
  // mile markers
  for (let m = 1; m * MI < r.length; m++) { let k = 0; while (k < g.cum.length - 1 && g.cum[k] < m * MI) k++; L.marker(ll[k], { icon: L.divIcon({ className: '', html: `<div style="font:600 10px var(--f-mono);background:var(--ink);color:var(--panel);border-radius:8px;padding:1px 5px;transform:translate(-50%,-50%);white-space:nowrap">${m}</div>`, iconSize: null }), interactive: false }).addTo(routeLayer); }
  const pin = (cls) => L.divIcon({ className: '', html: `<div class="pin ${cls}"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] });
  L.marker(ll[0], { icon: pin('start'), title: 'Start' }).addTo(routeLayer);
  if (S.end) L.marker(ll[ll.length - 1], { icon: pin('end'), title: 'Finish' }).addTo(routeLayer);
}
function fitRoute() { const r = results[sel]; if (!map || !r) return; map.fitBounds(L.latLngBounds(r.geom.lat.map((la, k) => [la, r.geom.lon[k]])), { padding: [30, 30], maxZoom: 16 }); }
$('pickStart').onclick = () => { picking = picking === 'start' ? null : 'start'; $('pickStart').classList.toggle('on', picking === 'start'); $('pickEnd').classList.remove('on'); if (map) map.getContainer().style.cursor = picking ? 'crosshair' : ''; };
$('pickEnd').onclick = () => { picking = picking === 'end' ? null : 'end'; $('pickEnd').classList.toggle('on', picking === 'end'); $('pickStart').classList.remove('on'); if (map) map.getContainer().style.cursor = picking ? 'crosshair' : ''; };

// ---------- worker ----------
const WORKER_SRC = `${document.getElementById('routerSrc').textContent}
const lib = RouterLib(); let g = null;
function hillTopPlan(P) {
  const MI = 1609.344, T = P.targetM;
  const sx = (P.start.lon + 122.44) * lib.M_LON, sy = (P.start.lat - 37.76) * lib.M_LAT;
  const hills = g.places.filter(p => p.kind === 'hill').map(h => {
    const d = Math.hypot((h.lon + 122.44) * lib.M_LON - sx, (h.lat - 37.76) * lib.M_LAT - sy);
    const est = 2.7 * d;
    let fit = h.el / 60;
    if (T) { if (est > T * 1.1) fit -= (est - T * 1.1) / T * 25; if (est < T * 0.25) fit -= 1.5; }
    else if (d > 3000) fit -= 10;
    return { h, d, fit };
  }).sort((a, b) => b.fit - a.fit).slice(0, 5);
  let all = [];
  for (const c of hills) {
    const res = lib.plan(g, Object.assign({}, P, { destinations: [c.h], count: 2 }));
    for (const r of res.routes) { r.score -= c.h.el / 90; r.hill = c.h.name; all.push(r); }
  }
  all.sort((a, b) => a.score - b.score);
  const out = [], seen = new Set();
  for (const r of all) if (!seen.has(r.hill)) { out.push(r); seen.add(r.hill); if (out.length === 3) break; }
  for (const r of all) if (out.length < 3 && !out.includes(r)) out.push(r);
  return { routes: out };
}
self.onmessage = async (ev) => {
  const m = ev.data;
  if (m.type === 'init') { g = await lib.decodeBase64Gz(m.b64); self.postMessage({ type: 'ready' }); return; }
  if (m.type === 'plan') {
    try {
      const t0 = Date.now();
      const res = m.P.hillTop && !(m.P.destinations || []).length ? hillTopPlan(m.P) : lib.plan(g, m.P);
      for (const r of res.routes) { r.geom = { lat: r.geom.lat, lon: r.geom.lon, el: r.geom.el, cum: r.geom.cum }; }
      self.postMessage({ type: 'result', id: m.id, res: { routes: res.routes, ms: Date.now() - t0 } });
    } catch (e) { self.postMessage({ type: 'error', id: m.id, message: String(e && e.message || e) }); }
  }
};`;

// ---------- boot ----------
async function boot() {
  const b64 = $('graphData').textContent;
  const img = new Image(); img.src = 'data:image/png;base64,' + $('terrainData').textContent.trim();
  await img.decode(); terrainImg = img;
  G = await lib.decodeBase64Gz(b64);
  prepStreets();
  syncForm();
  if (typeof L !== 'undefined') initMap();
  $('mapLoading').hidden = true;
  worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })));
  await new Promise((res) => { worker.onmessage = (e) => { if (e.data.type === 'ready') res(); }; worker.postMessage({ type: 'init', b64 }); });
  PL = ParseLib(G.places);
  lastPrompt = $('prompt').value.trim();
  const local = applyParse(PL.localParse($('prompt').value));
  $('understood').innerHTML = describeSettings(local);
  runPlan();
}
setStatus('Loading map data…', true);
drawProfile();
boot().catch(e => { setStatus('Could not load the map data: ' + esc(e.message || e)); $('mapLoading').textContent = 'Map failed to load.'; });
})();
</script>
