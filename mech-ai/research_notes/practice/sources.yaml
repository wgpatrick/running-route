HUBSCNC:
  title: Hubs (Protolabs Network), How to design parts for CNC machining
  url: "https://www.hubs.com/knowledge-base/how-design-parts-cnc-machining/"
  level: fetched
  quotes:
    corner: "Recommended: 1/3 times cavity depth (or larger)"
    cavity: "Recommended cavity depth: 4 times cavity width"
    wall: "Recommended: 0.8 mm (metals), 1.5 mm (plastics). Feasible: 0.5 mm (metals), 1.0 mm (plastics)"
    thread: "The majority of the load applied to a thread is taken by the few first teeth (up to 1.5 times the nominal diameter). Threads longer than 3 times the nominal diameter are thus unnecessary."
    blind: "For threads in blind holes cut with taps (i.e. all threads smaller than M6), add an unthreaded length equal to 1.5 times the nominal diameter at the bottom of the hole."
    setups: "This is often acceptable if the part needs to be rotated up to three or four times, but anything above this limit is excessive. [...] To achieve maximum relative positional accuracy, two features\
      \ must be machined in the same setup."
    tolerance: "Our tolerances are either 2768 medium or fine. If tolerances are not specified, manufacturing partners will use the selected 2768 grade."
    drawing: "you'll have to include a 2D technical drawing if your model includes threaded holes or shafts and/or dimensions with tolerances tighter than the selected 2768 grade."
    drill: "Recommended: standard drill bit [...] Holes with a non-standard diameter must be machined with an end mill tool."
HUBSFDM:
  title: Hubs (Protolabs Network), How to design parts for FDM 3D printing
  url: "https://www.hubs.com/knowledge-base/how-design-parts-fdm-3d-printing/"
  level: fetched
  quotes:
    holes: "FDM often prints undersized vertical-axis holes. [...] If the diameter of the vertical axis hole is critical, the recommendation is to print it undersized and then drill the hole to the correct\
      \ diameter."
    chamfer: "If assembly or overall dimensions are critical to the function of an FDM part, include a 45 deg chamfer or radius on all edges touching the build plate."
    pins: "If your design contains pins smaller than 5mm in diameter, add a small fillet at the base of the pin. If function is critical, consider including a hole in your design in the location of the\
      \ pin, drill the hole to the correct size and insert an off-the-shelf pin."
    overhang: an overhang can usually be printed up to 45 deg without compromising quality
    bridge: "sagging or marks from support material are to some extent always present unless the bridge is less than 5mm"
    anisotropy: "FDM components are inherently weaker in one direction due to layer orientation. [...] the joints between each layer are actually small valleys. This creates a stress concentration with\
      \ a tendency to crack."
PROTOSHEET:
  title: Protolabs, Sheet metal fabrication design guidelines
  url: "https://www.protolabs.com/services/sheet-metal-fabrication/design-guidelines/"
  level: fetched
  quotes:
    holes: "Holes and slots should be a minimum of material thickness in diameter. If a material is 0.036 in. (0.914mm) or thinner, the hole should be 0.062 in. (1.574mm) from the material edge; if the\
      \ material is thicker than 0.036 in. (0.914mm), the hole should be at least 0.125 in. (3.175mm) from the material edge to avoid distortion."
    flange: "It is recommended to use the same radii across all bends, and flange length must be at least 4 times the material thickness."
    hardware: "In situations where hardware inserts are close to bend lines, [...] any hardware hole deformation (due to material stretching in the press brake) may affect the functionality of the insert\
      \ itself."
SCS:
  title: SendCutSend, Bending guidelines
  url: "https://sendcutsend.com/guidelines/bending/"
