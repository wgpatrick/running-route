    holes: All holes and cutouts are at least 50% material thickness for laser cut parts
    contact: "Flanges need to meet the minimum flange length for at least ~50-60% of the bend's length on both sides to provide enough press brake support."
    radius: "Bend radius and K factor are set per material thickness. [...] we don't offer custom bend radii."
    deburr: "Deburred Mild Steel is more prone to rusting, and is not recommended for outdoor use unless it's coated. [deburring is a separate, optional service: https://sendcutsend.com/services/deburring/]"
CNCK:
  title: "CNC Kitchen, Threaded inserts in 3D prints: tips and tricks"
  url: "https://www.cnckitchen.com/blog/tipps-amp-tricks-fr-gewindeeinstze-im-3d-druck-3awey"
  level: fetched
  quotes:
