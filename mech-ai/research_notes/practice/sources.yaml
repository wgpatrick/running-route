# Sources for research_notes/practice/rules.yaml. All accessed 2026-11-15.
# level: fetched  = the document itself was downloaded and the quoted text read (quotes are verbatim, OCR slips left in);
#        repo     = a document or vendor record already in this repository (vendor_docs/, mechloop/parts/vendor/);
#        snippet  = seen only through a web-search summary of the named page: wording NOT verified against the page;
#        recalled = from memory, no document consulted today. Never present a recalled figure as sourced.
# Unreachable or unusable today: see docs/PRACTICE_RULES.md section 7.
#        document = owner-delivered reference file (vendor_cad/staging/practice_refs), quoted with file name and page; derived = our derivation from documents.
RP1228:
  title: NASA Reference Publication 1228, Fastener Design Manual (R. T. Barrett, 1990)
  url: "https://ntrs.nasa.gov/api/citations/19900009424/downloads/19900009424.pdf"
  level: fetched
  quotes:
    lockwasher: "The lockwasher serves as a spring while the bolt is being tightened. However, the washer is normally flat by the time the bolt is fully torqued. At this time it is equivalent to a solid\
      \ flat washer, and its locking ability is nonexistent. In summary, a lockwasher of this type is useless for locking."
    preload_accuracy: "Preload measuring method / accuracy, percent: Feel (operator's judgment) +/-35; Torque wrench +/-25; Turn of the nut +/-15; Load-indicating washers +/-10; Fastener elongation +/-3\
      \ to 5; Strain gages +/-1"
    edge_distance: "Common design practice is to use a nominal edge distance of 2D from the fastener hole centerline, where D is the fastener diameter. The minimum edge distance should not be less than\
      \ 1.5D. The nominal distance between fasteners is 4D, but the thickness of the materials being joined can be a significant factor."
    nylon: "The main drawback of this pellet is that its maximum operating temperature is approximately 250 F. The nylon pellet will also be damaged quickly by reassembly."
    tooth_washer: "Although this washer does provide some locking action, it damages the mating surfaces. These scratches can cause crack formation in highly stressed fasteners, in mating parts, or both"
    grip: "Standard design practice is to choose a grip length such that the threads are never in bearing (shear). Where an exact grip length is not available, the thickness of the washers used under the\
      \ nut or bolthead can be varied enough to allow proper grip."
    inserts: "An insert is a special type of device that is threaded on its inside diameter and locked with threads or protrusions on its outside diameter [...] such as plastic and nonferrous materials,\
      \ as well as to repair stripped threads in a tapped hole."
    shear: "Whenever possible, bolts in shear should have a higher shear strength than the bearing yield strength of the materials they go through."
    galvanic: "The contact of dissimilar materials can create galvanic corrosion, which can become a major problem."
    adhesive: Loctite 242 is for removable fasteners [...] the best adhesives will function at 450 F
BOLTSCI:
  title: Bolt Science, Self-Loosening of Bolts and Nuts (vibration loosening)
  url: "https://www.boltscience.com/pages/vibloose.htm"
  level: fetched
  quotes:
    slip: "By far the most frequent cause of loosening is side sliding of the nut or bolt head relative to the joint, resulting in relative motion occurring in the threads. If this does not occur, then\
      \ the bolts will not loosen, even if the joint is subjected to severe vibration."
    spring_washer: "conventional spring lock washers are no longer specified, because it has been shown that they actually aid self loosening rather than prevent it."
    categories: "three basic locking fastener categories have been established. They are: free spinning, friction locking, and chemical locking."
GATES:
  title: "Gates, Light Power and Precision Drive Design Manual (CURRENT, GT3-era: 2MGT GT3 belts on GT2 sprockets); the repo file vendor_docs/Gates_GT2_design_manual.pdf is this manual, also delivered as\
    \ 12_Gates_light_power_precision.pdf (idlers p.70 [68], tensions p.67 [65])"
  url: "repo: vendor_docs/Gates_GT2_design_manual.pdf (record mechloop/parts/vendor/gates_gt2.json; origin https://www.gates.com/drivedesign)"
  level: repo
  quotes:
    teeth: "The designer should be sure that at least 6 belt teeth are in mesh on load carrying sprockets. For every tooth in mesh less than this (with a minimum of 2), 20% of the belt torque rating must\
      \ be subtracted."
    wrap: "In order to minimize the potential for belt ratcheting, each loaded sprocket in the system should also have a wrap angle of at least 60 deg. [...] Non-loaded idler sprockets do not have tooth\
      \ meshing or wrap angle restrictions."
    idler_side: "Inside idlers are generally preferred over backside idlers from a belt fatigue standpoint. [...] Inside idlers should be sprockets, but can be flat if the O.D. is equivalent to the pitch\
      \ diameter of a 40 groove sprocket. Backside idlers should be flat and uncrowned."
    slack: "Idlers should be placed on the slack (or non-load carrying) side if possible. [...] If spring loaded idlers are used, they should never be placed on the tight side"
    table9: "Table 9 - Idler Size Recommendations: 2MGT GT3: minimum inside idler 12 grooves; minimum backside idler 0.50 in O.D.; minimum inside flat idler 1.00 in O.D."
    backside_30: "Flat backside idlers should be used with diameters at least 30% larger than the minimum recommended inside sprocket size."
    shear: "Proper belt installation tension and rigid drive bracketry and framework is essential in preventing belt tooth jumping under peak torque loads. It is also helpful to design with more than the\
      \ normal minimum of 6 belt teeth in mesh to ensure adequate belt tooth shear strength."
    set_screws: 12-16 Groove pulleys have 1 set screw, all others have 2 at 90 degrees
    idler_flange: Flanging of idlers is generally not necessary.
SDPSI:
  title: "SDP/SI, Timing Belt Design and Installation Suggestions: General Guide Lines"
  url: "https://www.sdp-si.com/resources/beltdesignsuggestions.php"
  level: fetched
  quotes:
    teeth: "In order to deliver the rated horsepower, a belt must have six or more teeth in mesh with the grooves of the smaller pulley."
    width: The pulley diameter should never be smaller than the width of the belt.
    flange: "Because of a slight side thrust of synchronous belts in motion, at least one pulley in the drive must be flanged. When the center distance between the shafts is 8 or more times the diameter\
      \ of the smaller pulley, or when the drive is operating on vertical shafts, both pulleys should be flanged."
    idlers: "Idlers, either of the inside or outside type, are not recommended and should not be used except for power takeoff or functional use. When an idler is necessary, it should be on the slack side\
      \ of the belt. Inside idlers must be grooved, unless their diameters are greater than an equivalent 40-groove pulley. Flat idlers must not be crowned (use edge flanges). Idler diameters must exceed\
      \ the smallest diameter drive pulley. Idler arc of contact should be held to a minimum."
    tension: "a belt, when installed with a snug fit (that is, not too taut) assures longer life, less bearing wear and quieter operation. Preloading (often the cause of premature failure) is not necessary."
    adjust: "provision should be made for some center distance adjustment for ease in installing and removing belts. Do not force belt over flange of pulley."
    frame: "A nonrigid frame causes variation in center distance and resulting belt slackness. This, in turn, can lead to jumping of teeth"
    align: Be sure that shafts are parallel and pulleys are in alignment.
