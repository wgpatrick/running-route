- {id: SHF-011, cat: BRG, rule: "Never seat a set screw or a bearing on a thread", criterion: "bearing bores and hub set screws need a plain turned journal; a T8 thread crest is not a journal (undersize, 4 line contacts, set screw ruins the thread)",
