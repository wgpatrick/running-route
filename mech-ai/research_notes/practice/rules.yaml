# ---------------------------------------------------------------- safety and ergonomics
- {id: SAF-010, cat: SAF, rule: "No sharp edges or corners where hands or cables go", criterion: "all accessible metal edges broken (MCH-015, SHT-013, SHT-014); extrusion cut ends deburred and capped", applies: machine, severity: warning, src: [ISO13715.scope, RECALLED], basis: recalled, conf: high,
   status: not, auto: "sum of sharp convex edge length on parts with no edge note", fa: L, effort: S}
- {id: SAF-011, cat: SAF, rule: "Pinch and crush points of moving axes", criterion: "gaps that close between moving and fixed parts: either < 4 mm (finger cannot enter) or > 25 mm at the end of travel (recalled ISO 13854 finger values), or guarded / low force", applies: axes with drive force > about 75 N, severity: info,
   src: [RECALLED], basis: recalled, conf: low, status: not, auto: "closing gaps from the motion sweep with the joint's available force", fa: H, effort: M}
- {id: SAF-012, cat: SAF, rule: "Hot surfaces marked and out of casual reach", criterion: "bare metal above about 60 degC that can be touched: warning label; bed and hotend unavoidable, state it", applies: heaters, severity: info, src: [RECALLED], basis: recalled, conf: med, status: human, where: "electrical el.hot_parts"}
- {id: SAF-013, cat: SAF, rule: "Guard or enclose belt run-ins that fingers and hair can reach", criterion: "review; open-frame printers accept it", applies: belts, severity: info, src: [RECALLED], basis: recalled, conf: med, status: human}
- {id: SAF-014, cat: SAF, rule: "Stability: the machine does not tip or walk", criterion: "centre of mass projection inside the foot polygon with margin at a 10 deg tilt; feet declared; reaction of the heaviest axis at max accel < static friction",
   applies: bench machines, severity: info, src: [RECALLED], basis: recalled, conf: med, status: not, auto: "mass properties + feet positions", needs: "feet", fa: L, effort: S}
- {id: SAF-015, cat: SAF, rule: "Liftable by one person, with somewhere to grip", criterion: "mass <= about 20-25 kg for a one-person lift; grips that are not the gantry or the bed", applies: machine, severity: info, src: [RECALLED], basis: recalled, conf: med, status: partly, where: "geometry: mass", auto: "threshold on total mass", effort: S}
