# Practical mechanical engineering rules for a mechloop "practice" verifier. Research data only: nothing in mechloop reads this yet.
# Sources: sources.yaml (same folder). `src` entries are <source key>.<quote key>; `basis` is the level of the evidence behind the
# NUMBER in `criterion`: fetched | repo | document | derived | snippet | recalled (see sources.yaml and evidence_levels). A rule can be sourced in principle and recalled in number;
# then basis says recalled. conf: high / med / low. severity is a suggestion with its reason.
# status: checked (mechloop already does it: `where`), partly, not, human (cannot be machine-checked: review checklist).
# auto = how it could be checked from a mechloop design; needs = extra declaration; fa = false-alarm risk L/M/H; effort S/M/L.
# Units: mm, N, MPa, N.m, degrees. d = nominal thread diameter, t = sheet thickness.
# Version 2 (2026-11-15, later): re-sourced from the owner-delivered documents in vendor_cad/staging/practice_refs; see 'corrections' at the end and docs/PRACTICE_RULES.md section 7.
version: 2
date: 2026-11-15
categories:
  FST: threaded fasteners
  LOC: locating and constraint
  BRG: bearings and shafts
  BLT: belts
  LSC: lead screws
  LIN: linear guides
  STR: structure
  SHT: sheet metal
  MCH: machining
  PRT: 3D-printed parts
  ASM: assembly and service
  ELE: wiring
  SAF: safety and ergonomics
  DOC: documentation
rules:
- id: FST-001
  cat: FST
  rule: "Declare the property class of every screw and nut; do not design to 12.9 strength when commodity 8.8 / A2-70 will be bought"
  criterion: "each fastener SKU carries a class; preload and ratings use that class (Bossard, mu 0.14, max: M5 8.8 7.0 kN, 10.9 10.3 kN, 12.9 12.0 kN; M3 8.8 2436 N, 12.9 4111 N): the catalogue's 12.9 proof\
    \ loads overstate a commodity 8.8 or A2-70 screw by 40 % or more"
  applies: all screws
  severity: "warning: catalogue proof loads are class 12.9 while the SKU names no class"
  src:
  - RECALLED
  - BOSS_TQ.table
  basis: document
  conf: high
  status: not
  auto: catalogue field; compare required preload with the class
  needs: class on shcs()/add_screw
  fa: L
  effort: S
- id: FST-002
  cat: FST
  rule: "Size the screw to the joint: preload must exceed the working load with margin; prefer a longer clamp length"
  criterion: "0.75 x proof x n >= 2 x separating load; material under the head 1 to 3 d thick and bolt spacing 3 to 5 d (Slocum); self-loosening moment about preload x pitch / 2 (NASA-STD-5020B)"
  applies: loaded joints
  severity: "info: few printer joints are strength-limited"
  src:
  - RECALLED
  - BOSSARD.basis
  - SLOCUM9.thickness
  - NASA5020.tfsr16
  basis: document
  conf: med
  status: not
  where: "AGENT.md: 'Bolt preload and contact' not checked"
  auto: joint force from FEA reactions / load cases against n x preload
  needs: loads per joint
  fa: M
  effort: L
  correction: "clamped length >= 3 d where vibration matters (recalled) -> material under the head 1 to 3 d (Slocum 9-10)"
- id: FST-010
  cat: FST
  rule: Minimum thread engagement by tapped material
  criterion: "Bossard (coarse thread, 8.8 / 10.9 / 12.9): S235 steel 1.0 / 1.25 / 1.4 d; grey iron GJL 250 1.0 / 1.25 / 1.4 d; AlMgSi1 F32 (Rm > 330) 1.4 / 1.6 d / not tabulated; AlMg3 F18 (Rm > 180) 2\
    \ d (VDI formula 3 d); standard nut = full strength. Proposed checks: 6061 / 6082 (Rm about 290 to 310, just under F32's 330): ERROR below 1.5 d, WARNING 1.5 to 2 d on load-bearing or frequently removed\
    \ joints and for 10.9 / 12.9 screws (no Bossard row for 12.9 in aluminium); soft aluminium (6063 extrusion, cast plate MIC-6 / ATP-5, 5052): ERROR below 2 d; plastic: 2 d or an insert; a catalogue part's\
    \ own tapped hole follows its maker"
  applies: screws into tapped holes; T-nuts and catalogue tapped holes exempt
  severity: "error: stripped threads"
  src:
  - NORDLOCK.engagement
  - TAMESON.ranges
  - HUBSCNC.thread
  - BOSS_TE.table
  - SLOCUM9.engagement
  basis: document
  conf: high
  status: checked
  where: "interference: thread_engagement, thread_bottoms_out (1 d steel, 1.5 d aluminium, 2 d plastic)"
  auto: already; consider 2 d for aluminium and 1.5 d for brass
  fa: L
  effort: S
  note: "Bossard's trials cover M6 to M16 (6g / 6H); not validated for M2.5 to M5 (MISSING.txt 5). Slocum: engagement of 1 d already matches bolt tensile strength in a same-strength section. SOURCES DISAGREE:\
    \ Nord-Lock 2 d and Tameson 2 to 2.5 d for 'aluminium' (snippets) vs Bossard 1.4 d for strong Al and 2 d for soft Al. The extrusion alloy of the 2020 profile is not in the repo's vendor record."
  correction: "aluminium 2.0 d (Nord-Lock snippet; mechloop 1.5 d) -> by alloy strength per Bossard: 6061/6082 error < 1.5 d, warning 1.5 to 2 d; soft Al (6063, MIC-6, 5052) error < 2 d"
- id: FST-011
  cat: FST
  rule: Do not thread deeper than the thread can use
  criterion: engagement <= 3 d
  applies: tapped holes
  severity: "warning: cost, broken taps"
  src:
  - HUBSCNC.thread
  basis: fetched
  conf: high
  status: checked
  where: "manufacture: cnc.thread_depth_ratio"
- id: FST-012
  cat: FST
  rule: Blind tapped holes need run-out below the thread; the screw must not bottom
  criterion: "unthreaded depth >= 1.5 d below the last full thread (taps under M6); screw tip >= 1 pitch short of the bottom"
  applies: blind tapped holes
  severity: error if the screw bottoms (no clamp), warning for run-out
  src:
  - HUBSCNC.blind
  - SPIROL.depth
  basis: fetched
  conf: high
  status: checked
  where: "manufacture: cnc.blind_tap_runout_d_ratio; interference: thread_bottoms_out (catalogue holes)"
- id: FST-013
  cat: FST
  rule: Use a threaded insert or a nut where a soft material is assembled repeatedly
  criterion: "plastic or soft aluminium + a screw that is removed in service (wear part, cover) => insert or through-bolt with nut"
  applies: threads in plastic, cast plate, 5052
  severity: "warning: thread wears out"
  src:
  - RP1228.inserts
  - CNCK.why
  - SPIROL.flush
  basis: fetched
  conf: high
  status: partly
  where: "manufacture: fdm.thread_wall_d_ratio (insert guidance text)"
  auto: threads_into plastic and screw on a declared service item
  needs: service list (ASM-040)
  fa: L
  effort: S
- id: FST-020
  cat: FST
  rule: Clearance holes to ISO 273; choose the class deliberately
  criterion: "ISO 273 fine / medium / coarse: M2.5 2.7/2.9/3.1, M3 3.2/3.4/3.6, M4 4.3/4.5/4.8, M5 5.3/5.5/5.8, M6 6.4/6.6/7, M8 8.4/9/10 (H12 / H13 / H14); Bossard's torque and pressure tables assume medium;\
    \ larger than coarse => washer (FST-031); chamfer the hole edge under the head (MMCC note)"
  applies: clearance holes in made parts
  severity: info (class), warning (under fine, or over coarse without a washer)
  src:
  - ISO273.scope
  - RECALLED
  - MMCC273.table
  - BOSS_TQ.basis
  basis: document
  conf: high
  status: partly
  where: "tolerance: pattern start (p_all_start); parts.clearance_hole() gives one 'close' value, unverified"
  auto: measure each hole around each screw (tools/practice_audit.py does)
  fa: L
  effort: S
  correction: "table values recalled -> confirmed unchanged from the MMCC ISO 273 table (read from the scan)"
- id: FST-030
  cat: FST
  rule: Keep the pressure under the head and the nut below what the clamped material can carry
  criterion: "p = FM max / Ap <= pG. pG (VDI 2230:2015, short-term, room temperature): S235 mild steel 490 MPa (1986 table: St 37 260), stainless X5CrNiMo 630, AW-6082 T6 (Rm 290) 360 -> used for 6061-T6\
    \ (mapped), AW-5083 325, cast GK-AlSi9Cu3 (Rm 160) 200 -> used for MIC-6 cast plate (mapped, derived), 70 % of pG where no indentation is permitted; power screwdriver up to -25 %, chamfered hole up\
    \ to +25 % (steels). FM max from Bossard at mu 0.14 for the declared class (8.8 assumed when none: M3 2436 N, M5 7.0 kN)"
  applies: all clamped parts
  severity: "warning: embedding and preload loss"
  src:
  - PLASTCREEP.pressure
  - BOSSARD.basis
  - BOSS_SP.vdi2015
  - BOSS_SP.vdi1986
  - BOSS_SP.no_indent
  - BOSS_SP.shcs
  - BOSS_TQ.table
  basis: document
  conf: med
  status: not
  auto: preload from class torque, area from head and measured hole
  needs: torque or class
  fa: M
  effort: M
  note: "SOURCES DISAGREE: VDI 2230 1986 (St 37 260) vs 2015 (S235 490): both recorded, 2015 used. MIC-6 and 6061 are not in the table: the mapping to the nearest alloy by tensile strength is ours, labelled\
    \ derived."
  correction: "limit = yield of the clamped part (6061 276, MIC-6 105, steel 250); preload = recalled torque / (0.2 d) (M3 2167 N, M5 5700 N) -> limit = VDI 2230:2015 pG (6061 360 mapped, MIC-6 200 mapped,\
    \ mild steel 490); preload = Bossard FM max, 8.8, mu 0.14 (M3 2436 N, M5 7000 N)"
- id: FST-031
  cat: FST
  rule: "Plain washer under any head or nut that sits on a slot, an oversize hole, a soft or painted surface"
  criterion: "slot or hole larger than ISO 273 coarse, or head face supported < 80 % => washer. ISO 7089 (ID min / OD max / t): M3 3.2 / 7 / 0.5, M4 4.3 / 9 / 0.8, M5 5.3 / 10 / 1.0; ISO 7093 large: M3\
    \ 3.2 / 9 / 0.8, M4 4.3 / 12 / 1.0, M5 5.3 / 15 / 1.2; ISO 7090 starts at M5, ISO 7093-1 at M3"
  applies: slots, oversize holes, printed and thin parts
  severity: "warning: head digs in, adjustment creeps, joint loosens"
  src:
  - ISO7089.table
  - RECALLED
  - RC_WASH.iso7089
  - RC_WASH.iso7093
  - SLOCUM9.washer
  basis: document
  conf: high
  status: not
  auto: supported fraction of the head annulus on the first clamped part
  needs: washer catalogue part
  fa: L
  effort: S
  correction: "ISO 7089 dims from FreeCAD CSV; ISO 7093 not fetched -> ISO 7089 confirmed (RC); ISO 7093 added (M3 9 mm, M5 15 mm OD)"
- id: FST-032
  cat: FST
  rule: "Washer under the element that is turned on aluminium (anodised or bare) and on coated parts"
  criterion: "nut or head rotated against aluminium / paint => washer, to keep friction repeatable and the coating intact"
  applies: aluminium, anodised, painted
  severity: info
  src:
  - RECALLED
  basis: recalled
  conf: med
  status: not
  auto: material of the bearing part + which end is turned (the one with tool access)
  fa: M
  effort: S
- id: FST-033
  cat: FST
  rule: Countersinks only in sheet thick enough to keep a cylindrical land
  criterion: sheet >= 3.18 mm for a countersink (SendCutSend); head height <= 60 % of t (recalled)
  applies: sheet parts
  severity: warning
  src:
  - SCS.holes
  basis: repo
  conf: med
  status: checked
  where: "manufacture: sheet.countersink_min_thickness_mm"
- id: FST-034
  cat: FST
  rule: Leave enough floor under a counterbored head
  criterion: "material under a head (counterbore floor, thin flange) typically 1 to 3 d thick (Slocum); below 1 d check FST-030 on the floor"
  applies: counterbores
  severity: warning
  src:
  - RECALLED
  - SLOCUM9.thickness
  basis: document
  conf: med
  status: partly
  where: "manufacture: cnc floor / wall minimums (0.5-0.8 mm only)"
  auto: thickness of the first clamped interval when the head is recessed
  fa: M
  effort: S
  correction: floor >= 0.6 d (recalled) -> >= 1 d (Slocum, 'typically')
- id: FST-040
  cat: FST
  rule: "State a tightening torque for every structural joint; derive it from class, friction and the weakest clamped material"
  criterion: "torque from Bossard (VDI 2230:2015, 90 % of yield, max, no safety factor) at mu 0.14 (zinc-plated, the lower end of 0.14 to 0.24): class 8.8 M2.5 0.81, M3 1.41, M4 3.3, M5 6.5 N.m; 12.9 M3\
    \ 2.37, M5 11.2 N.m; at mu 0.10: M3 8.8 1.12, M5 8.8 5.2 N.m; minimum preload = FM max / alphaA, alphaA 1.6 to 2.0 for a hand torque wrench; reduce to the FST-030 / PRT-030 limit on soft parts; rail\
    \ bolts per Hiwin (M3 0.98 N.m in aluminium)"
  applies: all screws
  severity: "info: documentation"
  src:
  - BOSSARD.basis
  - RECALLED
  - BOSS_TQ.table
  - BOSS_TQ.friction
  - BOSS_TQ.alpha
  - HIWIN_INST.torque
  basis: document
  conf: high
  status: not
  auto: generate a torque table per screw group into BUILD.md
  fa: L
  effort: M
  correction: "8.8 torques M2.5 0.7, M3 1.3, M4 2.9, M5 5.7 N.m (recalled, mu about 0.14) -> M2.5 0.81, M3 1.41, M4 3.3, M5 6.5 N.m (Bossard mu 0.14); preload taken directly from the table, not from T /\
    \ 0.2 d"
  note: "Friction: the screws' finish is not declared (black-oxide socket screws are not in the Bossard example); 0.14 is used as the lowest practical value Bossard tells the user to assume. SEW (snippet)\
    \ uses 0.09 for 10.9 / 12.9."
- id: FST-041
  cat: FST
  rule: Do not design a joint that only works at an exact preload
  criterion: "hand torque scatter +/-35 % (feel), +/-25 % (torque wrench): a joint must work between 0.65 and 1.35 of nominal preload"
  applies: friction joints
  adjusters: null
  bearing preloads: null
  severity: info
  src:
  - RP1228.preload_accuracy
  - BOSS_TQ.alpha
  basis: fetched
  conf: high
  status: human
  auto: could bracket friction-joint checks (STR-014) with 0.65x preload
  effort: M
- id: FST-050
  cat: FST
  rule: Edge distance and pitch of fastener holes
  criterion: "hole centre to edge: nominal 2 d, minimum 1.5 d (NASA RP-1228); Bossard's recommended minimum edge distance c: M4 6, M5 7.5 mm (= 1.5 d); pitch 4 d nominal (NASA), 3 to 5 d (Slocum)"
  applies: metal parts; plastics want more (>= 2 d, recalled)
  severity: "warning: tear-out, bulged edge"
  src:
  - RP1228.edge_distance
  - BOSS_SP.edge
  - SLOCUM9.thickness
  basis: fetched
  conf: high
  status: partly
  where: "manufacture: sheet.hole_to_edge_t_ratio (1 t of web: a cutting rule, not a strength rule), fdm.thread_wall_d_ratio"
  auto: distance from each screw axis to the nearest boundary of each clamped part
  fa: M
  effort: S
- id: FST-051
  cat: FST
  rule: A joint needs two fasteners, or one fastener plus a feature that stops rotation
  criterion: "parts joined by one screw also share a pin, key, shoulder, rib-in-slot or a second screw: 'To resist rotation, a moment, or two forces acting as a couple, is required' (Slocum); one screw\
    \ is one force on a line"
  applies: all joints except pivots / axles
  severity: "warning: the part swings on its screw under vibration"
  src:
  - RECALLED
  - BOLTSCI.slip
  - SLOCUMFP.exact
  basis: document
  conf: med
  status: not
  auto: "screws per part pair; then look for a second contact that blocks rotation about the screw axis (or a declared join)"
  needs: '''axle'' / ''keyed'' join kinds exist'
  fa: M
  effort: M
- id: FST-052
  cat: FST
  rule: "Do not carry a sustained or alternating shear load on screw friction through clearance holes or slots when a shoulder, pin or hook can carry it"
  criterion: "service load across a slotted / clearance joint <= mu (0.15) x preload x 0.65 / 2; otherwise add a positive stop (jack screw, pin)"
  applies: belt tension anchors, motor mounts on slots, sliding mounts
  severity: "warning: slip is what loosens screws"
  src:
  - BOLTSCI.slip
  - RP1228.preload_accuracy
  - SLOCUM9.shear
  basis: fetched
  conf: med
  status: not
  auto: "belt tension and declared loads against friction capacity of the screws in slots; credit a jack screw that touches the part"
  needs: load per sliding joint
  fa: M
  effort: M
- id: FST-060
  cat: FST
  rule: "Nuts and tapped parts must sit on the threaded part of a partially threaded screw; the plain shank must be shorter than the grip"
  criterion: "ISO 4762 / DIN 912 thread length b: M2.5 17, M3 18, M4 20, M5 22, M6 24, M8 28 mm (Westfield); fully threaded up to M3 x 20, M4 x 25, M5 x 25, M6 x 30, M8 x 35 and partly threaded above, with\
    \ lg max = l - b (Aramfix DIN 912 matrix); every nut / tapped interval must start at least lg below the head"
  applies: long cap screws, studs made from screws
  severity: "error: cannot be assembled as drawn"
  src:
  - ISO4762.thread_length
  - RECALLED
  - WESTFIELD.b
  - ARAMFIX.matrix
  basis: document
  conf: high
  status: not
  auto: thread zone per screw against each threaded target's interval along the axis
  needs: b per size in the catalogue (already in vendor_docs CSV)
  fa: L
  effort: S
  correction: "b and full-thread lengths recalled / from the FreeCAD CSV -> confirmed unchanged (Westfield b; Aramfix full-thread rows)"
- id: FST-061
  cat: FST
  rule: Use stocked lengths and sizes
  criterion: "length in the preferred series; for lengths beyond the DIN 912 matrix rows (M3 > 30, M5 > 50) name a supplier: Lederer stocks stainless A2 / A4 M3 to 60 and M5 to 100 mm (M3 x 50, M5 x 90\
    \ included), in class 70 / 80, not 12.9"
  applies: all screws
  severity: "warning: lead time, substitution"
  src:
  - ISO4762.thread_length
  - ARAMFIX.matrix
  - LEDERER.stock
  basis: document
  conf: med
  status: partly
  where: interference STANDARD_LENGTHS_MM (used for bottoming only); ratings BOM
  auto: table lookup
  fa: L
  effort: S
  correction: "M3 x 50 and M5 x 90 'outside ISO 4762's range (M3 5-30, M5 8-50)': warning -> beyond the DIN 912 matrix but stocked in A2 / A4 (Lederer): info, with the strength class to declare"
  note: A definitive ISO 4762 length range is not verified (MISSING.txt 3).
- id: FST-062
  cat: FST
  rule: Thread should show past a nut, but not far
  criterion: "thread through a prevailing-torque (self-locking) nut: at least two threads (NASA-STD-5020B); through a plain nut: at least one pitch (recalled); not more than about 3 d unless an adjuster"
  applies: screw + nut joints
  severity: "info / warning (flush or short: nut not fully engaged)"
  src:
  - RECALLED
  - NASA5020.nuts
  basis: document
  conf: high
  status: partly
  where: "interference: nut counted full strength once the screw passes through"
  auto: tip position against the nut's far face
  fa: L
  effort: S
  correction: "1 pitch (2 in aerospace practice, recalled) -> 2 threads for self-locking nuts (NASA-STD-5020B p.86); 1 pitch for plain nuts stays recalled"
- id: FST-063
  cat: FST
  rule: Threads out of the shear plane
  criterion: in a joint loaded in shear the plain shank, not the thread, crosses the interface
  applies: shear joints with loads near capacity
  severity: info
  src:
  - RP1228.grip
  basis: fetched
  conf: high
  status: human
  auto: needs FST-060 data plus a load; low value for a printer
  effort: M
- id: FST-064
  cat: FST
  rule: A screw threads into one part only
  criterion: "'Both parts should NEVER have threaded holes because the threads will not be in phase' (Slocum): at most one tapped part (or one nut) per screw"
  applies: all screws
  severity: "warning: the joint cannot clamp"
  src:
  - SLOCUM9.threads
  basis: document
  conf: high
  status: not
  auto: "threads_into lists more than one non-nut part, or the core probe finds material of two parts"
  fa: L
  effort: S
- id: FST-070
  cat: FST
  rule: Every fastener on a vibrating or moving assembly has a declared locking provision
  criterion: "every fastener on a moving or vibrating assembly has a locking feature that does not depend on preload: prevailing-torque nut (nyloc / all-metal) or thread adhesive (NASA-STD-5020B TFSR 16\
    \ states it for spaceflight; adopted here as practice). Serrated flanges and jam nuts depend on preload: accepted only where preload is assured (metal seats), never as the only feature on plastic seats"
  applies: screws on moving bodies, motors, pulleys, bed, anything that sets an adjustment
  severity: "warning: a printer vibrates for thousands of hours"
  src:
  - BOLTSCI.slip
  - BOLTSCI.categories
  - RP1228.adhesive
  - NASA5020.tfsr16
  - NASA5020.serrated
  - SLOCUM9.vibration
  basis: document
  conf: high
  status: not
  auto: "per screw: body is moving or a motor is in the joint, and no locking attribute"
  needs: "add_screw(..., locking='nyloc'|'adhesive'|'serrated'|None) and nyloc / serrated catalogue parts"
  fa: M
  effort: S
  correction: "serrated flange listed as a full locking provision -> serrated / free-spinning features depend on preload (NASA): not accepted alone where the seat creeps"
- id: FST-071
  cat: FST
  rule: Do not specify split (helical spring) lock washers as a locking device
  criterion: no split lock washers in the BOM
  applies: all
  severity: warning
  src:
  - RP1228.lockwasher
  - BOLTSCI.spring_washer
  - NASA5020.serrated
  - NASA5020.split
  basis: fetched
  conf: high
  status: not
  auto: BOM scan
  fa: L
  effort: S
- id: FST-072
  cat: FST
  rule: "Nylon-insert nuts: temperature and reuse limits"
  criterion: "nylon locking element <= about 120 degC (250 degF); replace after a few reassemblies; near the hotend or under the bed use all-metal locknuts or adhesive rated for the temperature"
  applies: locknuts near heat (bed 80-100 degC, hotend)
  severity: warning
  src:
  - RP1228.nylon
  basis: fetched
  conf: high
  status: not
  auto: distance to el.hot_parts and the thermal estimate
  needs: locking attribute (FST-070)
  fa: L
  effort: M
- id: FST-073
  cat: FST
  rule: Thread adhesives (anaerobic) attack some plastics; keep them off ABS, PC, PETG parts
  criterion: "adhesive locking only where the screw touches metal alone; for screws through plastic use nylocs or serrated flanges"
  applies: screws through printed parts
  severity: info
  src:
  - RECALLED
  basis: recalled
  conf: med
  status: not
  auto: locking='adhesive' and a plastic in the stack
  needs: locking attribute
  fa: L
  effort: S
- id: FST-074
  cat: FST
  rule: "Tooth / star washers scratch the seat: use them for earth bonding, not as a general lock on finished or highly stressed parts"
  criterion: star washers only at protective-earth points
  applies: all
  severity: info
  src:
  - RP1228.tooth_washer
  - NASA5020.serrated
  basis: fetched
  conf: high
  status: partly
  where: "electrical: earth_point product text (ring terminals and star washer)"
  auto: BOM scan
  fa: L
  effort: S
- id: FST-080
  cat: FST
  rule: Standardise fasteners and tools
  criterion: "target <= 2 thread sizes and <= 3 lengths per size on the main assembly; one drive type; count distinct SKUs and tools and report"
  applies: whole machine
  severity: "info: build time and mistakes"
  src:
  - RECALLED
  basis: recalled
  conf: med
  status: partly
  where: "assemble / score: fastener_types, tool_changes (reported, no threshold)"
  auto: count; suggest merges (a length only used <= 4 times with a neighbour that fits)
  fa: L
  effort: S
- id: FST-081
  cat: FST
  rule: Avoid look-alike fasteners that are not interchangeable in the same area
  criterion: "two lengths of one size differing by <= 2 mm where the shorter one is needed to avoid bottoming (e.g. M3x6 next to M3x8 into 3.5 mm-deep block threads) => warn, key or segregate"
  applies: catalogue tapped holes with a maximum depth
  severity: "warning: the wrong screw jams a guide block or cracks a motor end bell"
  src:
  - RECALLED
  basis: recalled
  conf: med
  status: not
  auto: "per sub-assembly: would the next longer SKU in the BOM bottom out here?"
  fa: L
