   status: not, auto: "first clamped part under head / nut is plastic and no washer or sleeve part (tools/practice_audit.py does)", needs: "washer part; optional 'limiter' sleeve", fa: L, effort: S}
- {id: PRT-031, cat: PRT, rule: "Keep sustained load and heat off low-temperature plastics", criterion: "part temperature <= HDT - 15 K under load (PLA about 55, PETG about 70, ABS about 95 degC: recalled); motor mounts, bed parts, hotend parts not in PLA", applies: prints near heat, severity: warning,
   src: [RECALLED], basis: recalled, conf: med, status: partly, where: "electrical thermal estimates (probe); v8 chose PETG / ABS by hand", auto: "material table with HDT against el.hot_parts and motor case temperature", needs: "HDT per material", fa: M, effort: M}
- {id: PRT-032, cat: PRT, rule: "Consolidate parts only as far as each still prints without support and in a strong orientation", criterion: "report; no threshold", applies: prints, severity: info, src: [HUBSFDM.anisotropy, RECALLED], basis: recalled, conf: med, status: human}
- {id: PRT-033, cat: PRT, rule: "Functional bores print roundest with their axis vertical", criterion: "bearing seats and shaft bores: axis along print_up", applies: printed seats, severity: info, src: [RECALLED], basis: recalled, conf: med, status: not, auto: "bore axis against print_up", fa: L, effort: S}
# ---------------------------------------------------------------- assembly and service
- {id: ASM-010, cat: ASM, rule: "Tool access for every screw", criterion: "driver envelope clear when the screw is fitted", applies: screws, severity: error, src: [RECALLED], basis: recalled, conf: high, status: checked, where: "assemblability: driver access (at installation step, home pose)"}
- {id: ASM-011, cat: ASM, rule: "A nut needs a spanner or a trap; someone must hold it", criterion: "each loose nut: spanner swing >= 60 deg or socket access, or a captive pocket; else it spins", applies: screw + nut joints, severity: "warning: two-handed, blind work", src: [RECALLED], basis: recalled, conf: high,
   status: not, where: "assemblability checks the screw's driver only", auto: "clear annular sector around each nut that is not in a pocket", fa: M, effort: M}
- {id: ASM-012, cat: ASM, rule: "Assemble from one direction, onto a base, with gravity", criterion: "report from_below, turns; target zero from-below fasteners on bench sub-assemblies", applies: assembly, severity: info, src: [RECALLED], basis: recalled, conf: high, status: checked, where: "assemble: from_below, times_assembly_is_turned, needs_holding"}
- {id: ASM-013, cat: ASM, rule: "Poka-yoke: a part that fits two ways will be fitted the wrong way", criterion: "hole patterns of non-symmetric parts are not symmetric under 180 deg rotation / mirroring; left / right parts are identical or cannot be swapped", applies: custom parts,
   severity: info, src: [RECALLED], basis: recalled, conf: med, status: not, auto: "symmetry test of each part's interface pattern against its full shape", fa: M, effort: M}
- {id: ASM-020, cat: ASM, rule: "Adjustments and their locks reachable in the finished machine", criterion: "see LOC-006", applies: adjustments, severity: warning, src: [RECALLED], basis: recalled, conf: high, status: not, auto: "driver access test at the final assembly for named screws", needs: "LOC-006 fields", fa: L, effort: S}
- {id: ASM-030, cat: ASM, rule: "Wear and service parts come out without tearing the machine down", criterion: "declared service items (nozzle, belts, bed sheet, fans, hotend, board) each have a removal path that disturbs no alignment (rails, belt planes, bed level)",
   applies: printers, severity: warning, src: [RECALLED], basis: recalled, conf: high, status: not, auto: "run the disassembly search for each service item on the finished assembly; list what must come off first", needs: "design.service = [...]", fa: M, effort: M}
- {id: ASM-040, cat: ASM, rule: "Strain relief at both ends of every moving cable; fixed clamp before each connector", criterion: "every flexing span is clamped to a part at both ends, then >= 30 mm of slack to the connector; no flexing at a crimp or solder joint", applies: cables on moving bodies,
   severity: warning, src: [RECALLED], basis: recalled, conf: high, status: partly, where: "subsystems: cable_clamp_in_air; electrical looms (waypoints with clamp=)", auto: "last clamp to connector distance", fa: M, effort: S}
- {id: ASM-041, cat: ASM, rule: "Bend radius of flexing cables and chains", criterion: "continuous-flex cable: bend radius >= 7.5-10 x cable OD (maker's figure); loom / chain radius >= largest member's", applies: flexing looms, severity: warning, src: [RECALLED], basis: recalled, conf: med,
   status: partly, where: "electrical: bend_too_tight; Cable.min_bend_radius (15 mm default)", auto: "derive the minimum from the largest wire OD", effort: S}
- {id: ASM-042, cat: ASM, rule: "Cables clear of sharp edges, hot parts and moving parts; grommet or edge trim where a loom crosses sheet", criterion: "loom path >= 3 mm from unbroken sheet edges, or the edge is trimmed / the hole grommeted", applies: looms, severity: warning, src: [RECALLED], basis: recalled, conf: high,
   status: partly, where: "electrical: flex_span_crosses_part; AGENT.md 'cable paths (only lengths)'", auto: "distance from loom polyline to sharp edges found by MCH-015 / SHT-014", fa: M, effort: M}
- {id: ASM-050, cat: ASM, rule: "Label connectors, wires and fasteners groups; mark adjustment directions", criterion: review, applies: machine, severity: info, src: [RECALLED], basis: recalled, conf: med, status: human, where: "electrical: wiring.md labels"}
# ---------------------------------------------------------------- wiring
- {id: ELE-010, cat: ELE, rule: "Protective bonding of every exposed conductive part that can become live", criterion: "PE from the inlet to supply case, frame and each separately anodised metal sub-assembly near mains; continuity verified (test current 0.2-10 A, older edition); green-yellow, own terminal",
   applies: mains-powered machines, severity: error, src: [IEC60204.bonding, RECALLED], basis: snippet, conf: med, status: partly, where: "electrical: earth wires to supply and earth_point", auto: "FST-111 continuity graph", effort: L}
- {id: ELE-011, cat: ELE, rule: "Ferrules on stranded wire in screw terminals; ring terminals under screws; no tinned ends", criterion: "each stranded conductor in a screw terminal has a ferrule sized to the wire", applies: screw terminals, severity: warning, src: [RECALLED], basis: recalled, conf: high,
   status: partly, where: "electrical: connectors / terminals per wire (twin ferrule text)", auto: "terminal kind per port", effort: S}
- {id: ELE-012, cat: ELE, rule: "Segregate mains from low voltage; cover live terminals", criterion: "mains conductors routed apart from signal looms, double insulation or barrier; finger-safe covers on supply terminals", applies: mains wiring, severity: error, src: [RECALLED], basis: recalled, conf: high,
   status: partly, where: "electrical: mains safety checks", effort: M}
- {id: ELE-013, cat: ELE, rule: "Derate connectors and wires", criterion: "continuous current <= 80 % of connector rating; heater circuits on screw terminals or rated connectors, not signal headers", applies: power wiring, severity: warning, src: [RECALLED], basis: recalled, conf: med,
