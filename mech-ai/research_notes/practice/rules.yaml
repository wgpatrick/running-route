# Practical mechanical engineering rules for a mechloop "practice" verifier. Research data only: nothing in mechloop reads this yet.
# Sources: sources.yaml (same folder). `src` entries are <source key>.<quote key>; `basis` is the level of the evidence behind the
# NUMBER in `criterion`: fetched | repo | snippet | recalled (see sources.yaml). A rule can be sourced in principle and recalled in number;
# then basis says recalled. conf: high / med / low. severity is a suggestion with its reason.
# status: checked (mechloop already does it: `where`), partly, not, human (cannot be machine-checked: review checklist).
# auto = how it could be checked from a mechloop design; needs = extra declaration; fa = false-alarm risk L/M/H; effort S/M/L.
# Units: mm, N, MPa, N.m, degrees. d = nominal thread diameter, t = sheet thickness.
version: 1
date: 2026-11-15
categories: {FST: threaded fasteners, LOC: locating and constraint, BRG: bearings and shafts, BLT: belts, LSC: lead screws, LIN: linear guides,
             STR: structure, SHT: sheet metal, MCH: machining, PRT: 3D-printed parts, ASM: assembly and service, ELE: wiring, SAF: safety and ergonomics, DOC: documentation}
rules:
# ---------------------------------------------------------------- threaded fasteners
- {id: FST-001, cat: FST, rule: "Declare the property class of every screw and nut; do not design to 12.9 strength when commodity 8.8 / A2-70 will be bought",
   criterion: "each fastener SKU carries a class (8.8, 10.9, 12.9, A2-70); ratings use that class's proof load", applies: all screws,
   severity: "warning: catalogue proof loads are class 12.9 while the SKU names no class", src: [RECALLED], basis: recalled, conf: high,
   status: not, auto: "catalogue field; compare required preload with the class", needs: "class on shcs()/add_screw", fa: L, effort: S}
- {id: FST-002, cat: FST, rule: "Size the screw to the joint: preload must exceed the working load with margin; prefer a longer clamp length",
   criterion: "0.75 x proof load x n >= 2 x separating load; clamped length >= 3 d where vibration matters (longer bolts keep preload after embedding)",
   applies: loaded joints, severity: "info: few printer joints are strength-limited", src: [RECALLED, BOSSARD.basis], basis: recalled, conf: med,
   status: not, where: "AGENT.md: 'Bolt preload and contact' not checked", auto: "joint force from FEA reactions / load cases against n x preload", needs: "loads per joint", fa: M, effort: L}
- {id: FST-010, cat: FST, rule: "Minimum thread engagement by tapped material", criterion: "steel >= 1.0 d; aluminium >= 2.0 d (Nord-Lock; Tameson 2.0-2.5 d; mechloop uses 1.5 d); brass / cast iron 1.5-2.0 d; plastic >= 2 d or use an insert; a standard nut = full strength",
   applies: "screws into tapped holes; T-nuts and catalogue tapped holes exempt", severity: "error: stripped threads", src: [NORDLOCK.engagement, TAMESON.ranges, HUBSCNC.thread], basis: snippet, conf: high,
   status: checked, where: "interference: thread_engagement, thread_bottoms_out (1 d steel, 1.5 d aluminium, 2 d plastic)", auto: "already; consider 2 d for aluminium and 1.5 d for brass", fa: L, effort: S,
   note: "SOURCES DISAGREE on aluminium: 1.5 d (mechloop, common shop rule) vs 2 d (Nord-Lock) vs 2-2.5 d (Tameson)"}
- {id: FST-011, cat: FST, rule: "Do not thread deeper than the thread can use", criterion: "engagement <= 3 d", applies: tapped holes, severity: "warning: cost, broken taps",
   src: [HUBSCNC.thread], basis: fetched, conf: high, status: checked, where: "manufacture: cnc.thread_depth_ratio"}
- {id: FST-012, cat: FST, rule: "Blind tapped holes need run-out below the thread; the screw must not bottom", criterion: "unthreaded depth >= 1.5 d below the last full thread (taps under M6); screw tip >= 1 pitch short of the bottom",
   applies: blind tapped holes, severity: "error if the screw bottoms (no clamp), warning for run-out", src: [HUBSCNC.blind], basis: fetched, conf: high,
   status: checked, where: "manufacture: cnc.blind_tap_runout_d_ratio; interference: thread_bottoms_out (catalogue holes)"}
- {id: FST-013, cat: FST, rule: "Use a threaded insert or a nut where a soft material is assembled repeatedly", criterion: "plastic or soft aluminium + a screw that is removed in service (wear part, cover) => insert or through-bolt with nut",
   applies: "threads in plastic, cast plate, 5052", severity: "warning: thread wears out", src: [RP1228.inserts, CNCK.why], basis: fetched, conf: high,
   status: partly, where: "manufacture: fdm.thread_wall_d_ratio (insert guidance text)", auto: "threads_into plastic and screw on a declared service item", needs: "service list (ASM-040)", fa: L, effort: S}
- {id: FST-020, cat: FST, rule: "Clearance holes to ISO 273; choose the class deliberately", criterion: "fine / medium / coarse: M2.5 2.7/2.9/3.1, M3 3.2/3.4/3.6, M4 4.3/4.5/4.8, M5 5.3/5.5/5.8, M6 6.4/6.6/7.0, M8 8.4/9.0/10.0; larger than coarse needs a washer (FST-031); patterns of 4+ screws or printed parts: medium or coarse",
   applies: "clearance holes in made parts", severity: "info (class), warning (under fine, or over coarse without a washer)", src: [ISO273.scope, RECALLED], basis: recalled, conf: high,
   status: partly, where: "tolerance: pattern start (p_all_start); parts.clearance_hole() gives one 'close' value, unverified", auto: "measure each hole around each screw (tools/practice_audit.py does)", fa: L, effort: S}
- {id: FST-030, cat: FST, rule: "Keep the pressure under the head and the nut below what the clamped material can carry", criterion: "preload / bearing area <= limiting surface pressure (use yield of the clamped part if no figure); bearing area = pi/4 (dw^2 - dh^2)",
   applies: all clamped parts, severity: "warning: embedding and preload loss", src: [PLASTCREEP.pressure, BOSSARD.basis], basis: snippet, conf: med,
   status: not, auto: "preload from class torque, area from head and measured hole", needs: "torque or class", fa: M, effort: M, note: "limit values per material are recalled / assumed"}
- {id: FST-031, cat: FST, rule: "Plain washer under any head or nut that sits on a slot, an oversize hole, a soft or painted surface", criterion: "slot or hole > ISO 273 coarse, or head face supported < 80 % => ISO 7089 washer (M3 3.2x7x0.5, M4 4.3x9x0.8, M5 5.3x10x1.0); large slots: ISO 7093 wide series",
   applies: "slots, oversize holes, printed and thin parts", severity: "warning: head digs in, adjustment creeps, joint loosens", src: [ISO7089.table, RECALLED], basis: recalled, conf: high,
   status: not, auto: "supported fraction of the head annulus on the first clamped part", needs: "washer catalogue part", fa: L, effort: S}
- {id: FST-032, cat: FST, rule: "Washer under the element that is turned on aluminium (anodised or bare) and on coated parts", criterion: "nut or head rotated against aluminium / paint => washer, to keep friction repeatable and the coating intact",
   applies: "aluminium, anodised, painted", severity: "info", src: [RECALLED], basis: recalled, conf: med, status: not, auto: "material of the bearing part + which end is turned (the one with tool access)", fa: M, effort: S}
- {id: FST-033, cat: FST, rule: "Countersinks only in sheet thick enough to keep a cylindrical land", criterion: "sheet >= 3.18 mm for a countersink (SendCutSend); head height <= 60 % of t (recalled)", applies: sheet parts, severity: warning,
   src: [SCS.holes], basis: repo, conf: med, status: checked, where: "manufacture: sheet.countersink_min_thickness_mm"}
- {id: FST-034, cat: FST, rule: "Leave enough floor under a counterbored head", criterion: "floor under the head >= 0.6 d in aluminium (recalled); check FST-030 on the floor", applies: counterbores, severity: "warning",
   src: [RECALLED], basis: recalled, conf: low, status: partly, where: "manufacture: cnc floor / wall minimums (0.5-0.8 mm only)", auto: "thickness of the first clamped interval when the head is recessed", fa: M, effort: S}
- {id: FST-040, cat: FST, rule: "State a tightening torque for every structural joint; derive it from class, friction and the weakest clamped material", criterion: "reference: 90 % of yield at mu 0.14 (Bossard F.047 basis); class 8.8 about M3 1.3, M4 2.9, M5 5.7 N.m (recalled); reduce to the FST-030 limit on soft parts",
   applies: all screws, severity: "info: documentation", src: [BOSSARD.basis, RECALLED], basis: recalled, conf: med, status: not, auto: "generate a torque table per screw group into BUILD.md", fa: L, effort: M}
- {id: FST-041, cat: FST, rule: "Do not design a joint that only works at an exact preload", criterion: "hand torque scatter +/-35 % (feel), +/-25 % (torque wrench): a joint must work between 0.65 and 1.35 of nominal preload",
   applies: friction joints, adjusters, bearing preloads, severity: info, src: [RP1228.preload_accuracy], basis: fetched, conf: high, status: human, auto: "could bracket friction-joint checks (STR-014) with 0.65x preload", effort: M}
- {id: FST-050, cat: FST, rule: "Edge distance and pitch of fastener holes", criterion: "hole centre to edge: nominal 2 d, minimum 1.5 d; pitch nominal 4 d", applies: "metal parts; plastics want more (>= 2 d, recalled)",
   severity: "warning: tear-out, bulged edge", src: [RP1228.edge_distance], basis: fetched, conf: high, status: partly, where: "manufacture: sheet.hole_to_edge_t_ratio (1 t of web: a cutting rule, not a strength rule), fdm.thread_wall_d_ratio",
   auto: "distance from each screw axis to the nearest boundary of each clamped part", fa: M, effort: S}
- {id: FST-051, cat: FST, rule: "A joint needs two fasteners, or one fastener plus a feature that stops rotation", criterion: "parts joined by one screw must also share a pin, key, shoulder, rib-in-slot or a second screw", applies: "all joints except pivots / axles",
   severity: "warning: the part swings on its screw under vibration", src: [RECALLED, BOLTSCI.slip], basis: recalled, conf: high, status: not, auto: "screws per part pair; then look for a second contact that blocks rotation about the screw axis (or a declared join)", needs: "'axle' / 'keyed' join kinds exist", fa: M, effort: M}
- {id: FST-052, cat: FST, rule: "Do not carry a sustained or alternating shear load on screw friction through clearance holes or slots when a shoulder, pin or hook can carry it", criterion: "service load across a slotted / clearance joint <= mu (0.15) x preload x 0.65 / 2; otherwise add a positive stop (jack screw, pin)",
   applies: "belt tension anchors, motor mounts on slots, sliding mounts", severity: "warning: slip is what loosens screws", src: [BOLTSCI.slip, RP1228.preload_accuracy], basis: fetched, conf: med,
   status: not, auto: "belt tension and declared loads against friction capacity of the screws in slots; credit a jack screw that touches the part", needs: "load per sliding joint", fa: M, effort: M}
- {id: FST-060, cat: FST, rule: "Nuts and tapped parts must sit on the threaded part of a partially threaded screw; the plain shank must be shorter than the grip", criterion: "ISO 4762 thread length b = 2 d + 12 (M3 18, M4 20, M5 22, M6 24 mm); screws up to about M3x20, M4x25, M5x25, M6x30 are threaded to the head; every nut / tapped interval must start >= (L - b) below the head",
   applies: "long cap screws, studs made from screws", severity: "error: cannot be assembled as drawn", src: [ISO4762.thread_length, RECALLED], basis: repo, conf: high,
   status: not, auto: "thread zone per screw against each threaded target's interval along the axis", needs: "b per size in the catalogue (already in vendor_docs CSV)", fa: L, effort: S}
- {id: FST-061, cat: FST, rule: "Use stocked lengths and sizes", criterion: "length in the preferred series (4 5 6 8 10 12 16 20 25 30 35 40 45 50 60 ...) and inside the product standard's range for the diameter (ISO 4762: M3 5-30, M5 8-50); otherwise confirm a supplier",
   applies: all screws, severity: "warning: lead time, substitution", src: [ISO4762.thread_length], basis: repo, conf: med, status: partly, where: "interference STANDARD_LENGTHS_MM (used for bottoming only); ratings BOM",
   auto: "table lookup", fa: L, effort: S}
- {id: FST-062, cat: FST, rule: "Thread should show past a nut, but not far", criterion: "protrusion >= 1 pitch (2 pitches in aerospace practice, recalled) and <= about 3 d unless it is an adjuster", applies: screw + nut joints,
   severity: "info / warning (flush or short: nut not fully engaged)", src: [RECALLED], basis: recalled, conf: med, status: partly, where: "interference: nut counted full strength once the screw passes through", auto: "tip position against the nut's far face", fa: L, effort: S}
- {id: FST-063, cat: FST, rule: "Threads out of the shear plane", criterion: "in a joint loaded in shear the plain shank, not the thread, crosses the interface", applies: shear joints with loads near capacity,
   severity: info, src: [RP1228.grip], basis: fetched, conf: high, status: human, auto: "needs FST-060 data plus a load; low value for a printer", effort: M}
- {id: FST-070, cat: FST, rule: "Every fastener on a vibrating or moving assembly has a declared locking provision", criterion: "one of: prevailing-torque nut (nyloc), thread adhesive (medium strength, removable), serrated-flange screw / nut, or a joint shown not to slip (FST-052); plain nut + plain screw alone is not a provision",
   applies: "screws on moving bodies, motors, pulleys, bed, anything that sets an adjustment", severity: "warning: a printer vibrates for thousands of hours", src: [BOLTSCI.slip, BOLTSCI.categories, RP1228.adhesive], basis: fetched, conf: high,
   status: not, auto: "per screw: body is moving or a motor is in the joint, and no locking attribute", needs: "add_screw(..., locking='nyloc'|'adhesive'|'serrated'|None) and nyloc / serrated catalogue parts", fa: M, effort: S}
- {id: FST-071, cat: FST, rule: "Do not specify split (helical spring) lock washers as a locking device", criterion: "no split lock washers in the BOM", applies: all, severity: "warning", src: [RP1228.lockwasher, BOLTSCI.spring_washer], basis: fetched, conf: high,
   status: not, auto: "BOM scan", fa: L, effort: S}
- {id: FST-072, cat: FST, rule: "Nylon-insert nuts: temperature and reuse limits", criterion: "nylon locking element <= about 120 degC (250 degF); replace after a few reassemblies; near the hotend or under the bed use all-metal locknuts or adhesive rated for the temperature",
   applies: "locknuts near heat (bed 80-100 degC, hotend)", severity: warning, src: [RP1228.nylon], basis: fetched, conf: high, status: not, auto: "distance to el.hot_parts and the thermal estimate", needs: "locking attribute (FST-070)", fa: L, effort: M}
- {id: FST-073, cat: FST, rule: "Thread adhesives (anaerobic) attack some plastics; keep them off ABS, PC, PETG parts", criterion: "adhesive locking only where the screw touches metal alone; for screws through plastic use nylocs or serrated flanges",
   applies: screws through printed parts, severity: info, src: [RECALLED], basis: recalled, conf: med, status: not, auto: "locking='adhesive' and a plastic in the stack", needs: "locking attribute", fa: L, effort: S}
- {id: FST-074, cat: FST, rule: "Tooth / star washers scratch the seat: use them for earth bonding, not as a general lock on finished or highly stressed parts", criterion: "star washers only at protective-earth points", applies: all,
   severity: info, src: [RP1228.tooth_washer], basis: fetched, conf: high, status: partly, where: "electrical: earth_point product text (ring terminals and star washer)", auto: "BOM scan", fa: L, effort: S}
- {id: FST-080, cat: FST, rule: "Standardise fasteners and tools", criterion: "target <= 2 thread sizes and <= 3 lengths per size on the main assembly; one drive type; count distinct SKUs and tools and report", applies: whole machine,
   severity: "info: build time and mistakes", src: [RECALLED], basis: recalled, conf: med, status: partly, where: "assemble / score: fastener_types, tool_changes (reported, no threshold)", auto: "count; suggest merges (a length only used <= 4 times with a neighbour that fits)", fa: L, effort: S}
- {id: FST-081, cat: FST, rule: "Avoid look-alike fasteners that are not interchangeable in the same area", criterion: "two lengths of one size differing by <= 2 mm where the shorter one is needed to avoid bottoming (e.g. M3x6 next to M3x8 into 3.5 mm-deep block threads) => warn, key or segregate",
   applies: "catalogue tapped holes with a maximum depth", severity: "warning: the wrong screw jams a guide block or cracks a motor end bell", src: [RECALLED], basis: recalled, conf: med, status: not, auto: "per sub-assembly: would the next longer SKU in the BOM bottom out here?", fa: L, effort: S}
- {id: FST-090, cat: FST, rule: "Screws driven straight into printed plastic are for one-time, low-load joints", criterion: "no machine screw threaded directly into a printed part where the joint is structural or re-opened; use insert, captive nut or through-bolt", applies: printed parts,
   severity: warning, src: [CNCK.why, CNCK.overtighten], basis: fetched, conf: high, status: partly, where: "interference thread_engagement (2 d in plastic); manufacture fdm.thread_wall_d_ratio", auto: "threads_into a plastic part", fa: L, effort: S}
- {id: FST-091, cat: FST, rule: "Heat-set inserts: hole, depth and wall", criterion: "straight (not tapered) hole to the insert maker's diameter (M3 brass insert: 4.0 mm, test-print 4.0-4.4); blind hole about 1 mm deeper than the insert; wall around the hole >= 0.5 x insert OD (>= 1.6-2.0 mm for M2-M3); no chamfer needed",
   applies: inserts in printed parts, severity: warning, src: [CNCK.rules, INSERTS.m3], basis: snippet, conf: med, status: not, auto: "insert catalogue part with hole / wall data; measure the boss", needs: "heat_set_insert() part", fa: L, effort: M}
- {id: FST-092, cat: FST, rule: "Put the insert or captive nut on the side where the load pulls it INTO the part", criterion: "screw tension must seat the insert / nut against plastic, not draw it out of its hole", applies: inserts, nut traps, severity: "warning: pull-out",
   src: [RECALLED], basis: recalled, conf: high, status: not, auto: "insert on the far side of the clamped stack from the screw head = good; same side = pull-out", needs: "insert part", fa: L, effort: S}
- {id: FST-093, cat: FST, rule: "Captive nut pockets: closed against rotation, open for insertion, with plastic behind the nut", criterion: "pocket across flats = nut AF + 0.2 to 0.4 mm; >= 2 mm (or 0.6 d) of plastic between nut face and the clamped interface; nut insertable in the assembled state or retained",
   applies: printed parts with nut pockets, severity: info, src: [RECALLED], basis: recalled, conf: med, status: partly, where: "interference (nut overlap), assemblability (nut has a path in)", auto: "measure the pocket around each nut inside a printed part", fa: M, effort: M}
- {id: FST-100, cat: FST, rule: "Say which T-nut: slide-in nuts must be in the slot before the slot end is closed; drop-in / roll-in nuts for anything added later", criterion: "each T-nut SKU names its type; a slide-in nut in a slot whose both ends are blocked at that assembly step is an error",
   applies: T-slot extrusions, severity: "error for trapped slide-in nuts, else info", src: [RECALLED], basis: recalled, conf: high, status: not, where: "T-nuts are BOM lines, not geometry (AGENT.md)", auto: "slot ends blocked at the step where the screw is fitted (assembly order exists)", needs: "T-nut type + position", fa: M, effort: M}
- {id: FST-101, cat: FST, rule: "A part on T-nuts wants two of them (or a key in the slot); a single T-nut pivots and slides", criterion: "parts held to an extrusion by one T-nut screw need a second constraint; loads along the slot are carried by friction only (FST-052)", applies: T-slot joints,
   severity: warning, src: [RECALLED], basis: recalled, conf: high, status: not, auto: "T-nut screws per part", fa: L, effort: S}
- {id: FST-102, cat: FST, rule: "Tapped extrusion ends: tap the core hole to depth, deburr, and back the joint with a bracket where it carries moment", criterion: "end tap M5 in the 2020 core hole, engagement >= 2 d in 6063; a blind butt joint on one screw also needs an anti-rotation feature (bracket, plate)",
   applies: extrusion butt joints, severity: info, src: [RECALLED], basis: recalled, conf: med, status: partly, where: "interference thread_engagement; fea AssemblyCase lower bound", auto: "FST-051 on extrusion ends", fa: L, effort: S}
- {id: FST-110, cat: FST, rule: "Mind galvanic pairs where moisture can stand", criterion: "indoors dry: stainless or zinc-plated steel in aluminium is accepted; avoid bare carbon steel sheet against aluminium without a finish; give laser-cut mild steel a finish (paint, zinc, oil)",
   applies: mixed-metal joints, severity: info, src: [RP1228.galvanic, SCS.deburr], basis: fetched, conf: med, status: not, auto: "material pairs in contact + declared finish", needs: "finish attribute", fa: M, effort: S}
- {id: FST-111, cat: FST, rule: "An earth bond through anodised or painted metal must break the coating", criterion: "serrated washer or scraped seat at every protective-earth joint; anodised extrusions are not bonded to each other by their brackets unless shown", applies: PE joints,
   severity: "error if a PE path relies on anodised contact", src: [RECALLED, IEC60204.bonding], basis: recalled, conf: high, status: partly, where: "electrical: earth_point; builder_work text", auto: "PE continuity graph over metal parts with joint conductivity flags", needs: "finish per part", fa: M, effort: L}
# ---------------------------------------------------------------- locating and constraint
- {id: LOC-001, cat: LOC, rule: "Exact constraint: count what holds each body; make every redundant constraint compliant, floating or adjusted", criterion: "per moving body: constraints from guides, screws, nuts = 6 - DOF; each extra one needs a declared float / flexure / adjustment",
   applies: axes, bed supports, severity: "warning: binding, wear", src: [SLOCUM.ld, RECALLED], basis: recalled, conf: high, status: partly, where: "fea.bed_support constraint / z_over_constrained; tolerance two-rail and screw-to-rail checks",
   auto: "generalise the bed-support constraint count to X and Y", fa: M, effort: L}
- {id: LOC-002, cat: LOC, rule: "Two parallel rails: one is the master against a reference edge, the other is set parallel to it at assembly and then locked", criterion: "allowable non-parallelism MGN12: 9 um (ZF / Z0), 5 um (Z1): only reachable by setting the slave rail with the carriage as gauge",
   applies: two-rail axes, severity: warning, src: [HIWIN.parallel, HIWIN_SNIP.edge], basis: repo, conf: high, status: checked, where: "tolerance: two rails parallel; Adjustment rail_align"}
- {id: LOC-003, cat: LOC, rule: "A lead screw must not also be a guide: float the nut or the far end", criterion: "nut radial float >= 99.7 % misalignment of screw to rails; do not fix both screw ends rigidly AND the nut", applies: screw-driven axes,
   severity: warning, src: [RECALLED], basis: recalled, conf: high, status: checked, where: "tolerance lead_screws; Adjustment float"}
- {id: LOC-004, cat: LOC, rule: "Screws clamp, they do not locate: use dowels, shoulders, ribs-in-slots or a tight pattern where position matters", criterion: "a position requirement tighter than the hole clearance (M3 medium: +/-0.2 mm) across a screwed joint needs a locating feature or an adjustment",
   applies: "joints in a tolerance chain", severity: info, src: [RECALLED], basis: recalled, conf: high, status: partly, where: "tolerance: joint play of screws is simulated; adjustments credited", auto: "list joints whose play dominates a failed stack-up and that have no locating feature", fa: M, effort: M}
- {id: LOC-005, cat: LOC, rule: "Two-pin location: one round hole and one slot aimed at it", criterion: "a part located by two pins / tight screws: second feature is a slot along the line of centres, never two tight round holes more than a few d apart", applies: pinned parts,
   severity: info, src: [RECALLED], basis: recalled, conf: high, status: not, auto: "needs pins as parts", needs: "dowel_pin() part and 'pin' join", fa: L, effort: M}
- {id: LOC-006, cat: LOC, rule: "Every adjustment has (a) a controlled way to move it, (b) a lock that does not disturb it, (c) tool access in the finished machine", criterion: "Adjustment declares mover (jack screw, nut pair, slot by hand), lock (screws, jam nut, adhesive) and is reachable at the assembled pose",
   applies: all declared adjustments, severity: "warning: an adjustment that drifts or cannot be reached is not one", src: [RECALLED], basis: recalled, conf: high, status: not, where: "Adjustment has name, kind, range only",
   auto: "Adjustment(lock=[screw names], mover=...): locks must exist, be FST-070-locked, and pass driver access in the FINAL assembly, not only at their own step", needs: "two fields on Adjustment", fa: L, effort: M}
- {id: LOC-007, cat: LOC, rule: "Allow thermal growth: one fixed point, the rest free to slide or flex", criterion: "alpha dT L (aluminium 23.6e-6: 0.3 mm on 220 mm at 60 K) must be taken by slots / flexures, not by clamped screws", applies: heated beds, long aluminium on steel,
   severity: warning, src: [RECALLED], basis: recalled, conf: high, status: partly, where: "fea ThermalCase (bow, gap); AGENT.md 'fixed at one point and free to grow at the others'", auto: "bed held at more than one rigid point without a declared flexure", fa: M, effort: M}
- {id: LOC-008, cat: LOC, rule: "Abbe: keep the working point close to the guide and the drive in line with the mass centre and friction", criterion: "offset nozzle-to-rail and belt-to-centre-of-mass as small as layout allows; report the arms", applies: carriages, severity: info,
   src: [SLOCUM.abbe], basis: snippet, conf: high, status: partly, where: "twin: toolhead tilt spring from block spacing and nozzle distance; fea.bed_support screw offset", auto: "report arms; no threshold", effort: S}
- {id: LOC-009, cat: LOC, rule: "Bearing spacing against overhang (Saint-Venant / 'golden' proportion)", criterion: "spacing of guide points along the travel / distance to the load >= 1 (jam risk below), about 1.6 good, 3 ideal; for plain bushings 2:1 minimum",
   applies: carriages on one rail, cantilevers, severity: "warning below 1", src: [SLOCUM.ld], basis: snippet, conf: med, status: partly, where: "ratings: cantilever_on_guide_blocks; fea z_guides_bind", auto: "ratio from block positions and tool point", fa: M, effort: S}
- {id: LOC-010, cat: LOC, rule: "Short, closed structural loop between tool and work", criterion: "human review of the path nozzle - gantry - frame - Z - bed", applies: machine, severity: info, src: [RECALLED], basis: recalled, conf: med, status: human}
- {id: LOC-011, cat: LOC, rule: "Locate both members of a critical pair from the same part / the same set-up", criterion: "shortest chain between two features that must align", applies: tolerance chains, severity: info, src: [HUBSCNC.setups], basis: fetched, conf: high,
   status: checked, where: "tolerance: chains; hints 'locate both parts from one part'"}
# ---------------------------------------------------------------- bearings and shafts
- {id: BRG-010, cat: BRG, rule: "Fit by load direction: the ring that sees a rotating load gets the tight fit", criterion: "inner ring rotating under a fixed-direction load: shaft j5-k5 (light press), housing H7 (slide); state the fit of both seats",
   applies: rolling bearings, severity: info, src: [RECALLED], basis: recalled, conf: high, status: partly, where: "tolerance: shaft_bore_pairs, design.join(a, b, 'press')", auto: "require a declared fit for each ring", fa: L, effort: S}
- {id: BRG-011, cat: BRG, rule: "A printed bearing seat is a locating pocket, not a press fit that lasts", criterion: "bearing in plastic: retain axially by shoulder + cover / screw / circlip; do not count on interference (creep) and expect 0.1-0.3 mm radial play in a 'sliding' printed seat",
   applies: bearings in printed parts, severity: warning, src: [RECALLED, PLASTCREEP.creep], basis: recalled, conf: med, status: not, auto: "bearing whose seat part is plastic: BRG-020 on both sides + radial clearance drawn", fa: L, effort: S}
- {id: BRG-020, cat: BRG, rule: "Retain the locating bearing axially in BOTH directions, on both rings", criterion: "each ring of the locating bearing has a shoulder, sleeve, circlip, cover or collar on both faces; the load path for axial force in each direction is drawn",
   applies: shafts carrying axial load, severity: "warning (error when a declared axial load has no path)", src: [BEARARR.arrangement, RECALLED], basis: snippet, conf: high,
   status: not, where: "AGENT.md 'axial retention of bearings' not checked", auto: "probe the annulus above / below each ring for an abutting part (tools/practice_audit.py does)", fa: M, effort: S}
- {id: BRG-021, cat: BRG, rule: "One locating bearing per shaft; the other floats", criterion: "exactly one bearing constrained axially both ways; the other free on one ring (thermal growth, no fight)", applies: two-bearing shafts, severity: info,
   src: [BEARARR.arrangement], basis: snippet, conf: high, status: not, auto: "from BRG-020 results per shaft", fa: M, effort: S}
- {id: BRG-022, cat: BRG, rule: "Axial load on a deep-groove ball bearing stays a fraction of its static rating", criterion: "Fa <= 0.5 C0 (<= 0.25 C0 for small / light-series bearings); 608: C0 1370 N -> about 340 N", applies: ball bearings used as thrust,
   severity: info, src: [RECALLED], basis: recalled, conf: med, status: partly, where: "ratings: guide loads against catalogue ratings ('typical')", auto: "axial share of the joint load per bearing", fa: L, effort: S, note: "the 0.5 / 0.25 C0 figures were searched for and not confirmed today"}
- {id: BRG-023, cat: BRG, rule: "Axial load goes through a shoulder, collar or circlip, not through set-screw friction or a press fit", criterion: "every axial load path element is a positive stop; a set-screwed hub in the path is a warning", applies: lead screws, vertical shafts,
   severity: "warning: slips in service, slowly", src: [RECALLED, MDSET.flat], basis: recalled, conf: high, status: not, auto: "axial path from nut to frame: joins of kind set_screw / press on it", fa: L, effort: M}
- {id: SHF-010, cat: BRG, rule: "Set screws bear on a flat (or dimple), two at 90 degrees, and are locked", criterion: "hub on a shaft by set screws: flat or spot on the shaft under at least one screw; two screws at 90 deg (Gates stock pulleys: 2 above 16 grooves); thread adhesive",
