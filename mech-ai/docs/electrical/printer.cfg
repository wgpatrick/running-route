# printer.cfg for printer_v4: GENERATED by mechloop from the electrical model. Do not edit by hand;
# change the design and regenerate. Directions (dir_pin '!') and the extruder rotation_distance must be
# confirmed on the machine; PID values come from a simulated PID_CALIBRATE and should be re-run on the real heater.

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 4000
max_z_velocity: 12
max_z_accel: 200

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 180
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.280
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: 0
position_max: 180
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.200
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 2
endstop_pin: ^PC2
position_endstop: 0.100
position_min: -0.500
position_max: 153.100
homing_speed: 5
second_homing_speed: 1

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.280
sense_resistor: 0.110
stealthchop_threshold: 0

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.71
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA0
control: pid
pid_Kp: 34.112
pid_Ki: 3.115
pid_Kd: 93.382
min_temp: 0
max_temp: 280

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.600
sense_resistor: 0.110

[heater_bed]
heater_pin: PC9
sensor_type: Generic 3950
sensor_pin: PC4
control: pid
pid_Kp: 69.505
pid_Ki: 4.827
pid_Kd: 250.218
min_temp: 0
max_temp: 120

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

[verify_heater heater_bed]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

[fan]
pin: PC6

[heater_fan hotend_fan]
pin: PC7
heater: extruder
heater_temp: 50.0

# mains relay ahead of the 24 V supply: energised while the firmware runs, dropped on any shutdown
[output_pin ps_on]
pin: PC13
value: 1
shutdown_value: 0

