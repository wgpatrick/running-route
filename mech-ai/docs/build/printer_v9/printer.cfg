# printer.cfg for printer_v9: GENERATED by mechloop from the electrical model. Do not edit by hand;
# change the design and regenerate. Directions (dir_pin '!') and the extruder rotation_distance must be
# confirmed on the machine; PID values come from a simulated PID_CALIBRATE and should be re-run on the real heater.
# Input shaper, pressure advance and probe offsets below are PREDICTIONS from the simulation, each resting on
# assumed values named beside it: re-measure on the machine (SHAPER_CALIBRATE, a pressure-advance test print,
# PROBE_CALIBRATE, BED_MESH_CALIBRATE).

[mcu]
# klipper_mcu: stm32f446
serial: /dev/ttyAMA0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 4000
max_z_velocity: 12
max_z_accel: 200

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG6
position_endstop: 0
position_min: 0
position_max: 180
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.280
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG9
position_endstop: 214.5
position_min: 0
position_max: 214.5
homing_speed: 50
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 1.200
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y1]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 40

[tmc2209 stepper_y1]
uart_pin: PC6
run_current: 1.200
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
position_min: -1.550
position_max: 183.100
homing_speed: 5
second_homing_speed: 1
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC7
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 2

[tmc2209 stepper_z1]
uart_pin: PE4
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 2

[tmc2209 stepper_z2]
uart_pin: PE1
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 0

[z_tilt]
z_positions:
    90, 272.75
    -70, 1.75
    250, 1.75
points:
    90, 185
    10, 5
    170, 5
speed: 100
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075

[extruder]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 26.8937
gear_ratio: 11.262:1
full_steps_per_rotation: 400
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF4
control: pid
pid_Kp: 47.405
pid_Ki: 19.752
pid_Kd: 28.443
min_temp: 0
max_temp: 280
max_extrude_only_distance: 100
max_extrude_only_velocity: 60
max_extrude_only_accel: 3000
# pressure advance: equal to the twin's 32 ms melt-flow lag (direct drive, 0.4 mm nozzle: factory pressure-advance values (fitted_parameters.json: extruder_lag_s), range 0.02 to 0.058 s); not measured on this machine, no sweep run: print a pressure-advance test
pressure_advance: 0.0315
pressure_advance_smooth_time: 0.04

[tmc2209 extruder]
uart_pin: PF2
run_current: 0.400
sense_resistor: 0.110

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
control: pid
pid_Kp: 73.232
pid_Ki: 4.320
pid_Kd: 310.322
min_temp: 0
max_temp: 90

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

[verify_heater heater_bed]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

[fan]
pin: PA8

# fan 'hotend_fan' is wired to the board's +5 V rail: it runs whenever the machine is powered (no firmware section)

# mains relay ahead of the 24 V supply: energised while the firmware runs, dropped on any shutdown
[output_pin ps_on]
pin: PE11
value: 1
shutdown_value: 0

# input shaper: predicted by the twin, not measured: resonance X 78.0 Hz, Y 72.4 Hz (belt stiffness only, no FEA frame stiffness); damping assumed. Run SHAPER_CALIBRATE
[input_shaper]
shaper_type_x: ei
shaper_freq_x: 98.6
damping_ratio_x: 0.065
shaper_type_y: mzv
shaper_freq_y: 72.8
damping_ratio_y: 0.069

# probe: offsets from the CAD; z_offset from the probe's nominal switching distance on steel (5.0 mm) - set it on the machine with PROBE_CALIBRATE
# that distance: OMRON E2E data sheet CSM_E2E_DS_E_12_4: 5 mm +/-10 % on the standard iron target
[probe]
pin: ^!PG10
x_offset: 0
y_offset: 34.5
z_offset: 3.000
speed: 5
lift_speed: 10
samples: 3
samples_result: median
sample_retract_dist: 2
samples_tolerance: 0.04
samples_tolerance_retries: 3

# Z homes with the probe over the middle of the bed
[safe_z_home]
home_xy_position: 90, 72.75
speed: 100
z_hop: 5
z_hop_speed: 5

# mesh bounds are probe positions: the bed inset by the probe's edge margin, cut to where the probe can reach
[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 0, 34.5
mesh_max: 180, 223.75
probe_count: 5, 5
algorithm: lagrange
mesh_pps: 2, 2
fade_start: 1
fade_end: 10
fade_target: 0
split_delta_z: 0.01
zero_reference_position: 90, 107.25

